<script>
function showError(msg) {
  var box = document.getElementById('errbox');
  box.style.display = 'block';
  box.textContent = '오류 발생:\n' + msg + '\n\n이 화면을 캡처해서 확인해보세요.';
  document.getElementById('boot').textContent = '앱 로딩 실패';
}
window.onerror = function(msg, src, line, col, err) {
  showError(msg + '\n위치: ' + (src||'') + ' ' + line + ':' + col);
};
function cdnFail(name) {
  showError(name + ' 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인해주세요.');
}

<script>
window.addEventListener('load', function() {
  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
    if (document.getElementById('errbox').style.display !== 'block') cdnFail('필수');
    return;
  }
  try {
    var code = document.getElementById('app-src').textContent;
    var compiled = Babel.transform(code, { presets: ['react'] }).code;
    (new Function(compiled))();
    document.getElementById('boot').style.display = 'none';
  } catch (e) {
    showError(e.message + (e.stack ? '\n' + e.stack.split('\n').slice(0,3).join('\n') : ''));
  }
});
</script>

<script type="text/plain" id="app-src">
// ════════════════════════════════════════════════════════════════════
//  자산 관제 콘솔 · PF-09 (자동완성 UI 개선 및 반응속도 최적화)
// ════════════════════════════════════════════════════════════════════

// ═══ [1] CONFIG ═════════════════════════════════════════════════════

const APP_VERSION = "PF-09";
const SCHEMA_VERSION = 8;
const STORAGE_KEY = "portfolio-data-v8";
const LEGACY_STORAGE_KEYS = ["portfolio-data-v7", "portfolio-data-v6"];

const PROXY_URL = "https://finnhub-proxy.seowonhaha.workers.dev";
// Cloudflare Worker의 CLIENT_SECRET과 반드시 동일한 값으로 바꿔주세요.
const CLIENT_KEY = "1639a4b7aff5f79e5b199673a1be278773127eea3490c344";
const COINGECKO_URL = "https://api.coingecko.com/api/v3/simple/price";
const FX_URL = "https://open.er-api.com/v6/latest/USD";

const CRYPTO_IDS = { BTC: "bitcoin", ETH: "ethereum", SOL: "solana", XRP: "ripple", DOGE: "dogecoin", ADA: "cardano", AVAX: "avalanche-2", LINK: "chainlink" };
const SUPPORTED_COINS_LABEL = Object.keys(CRYPTO_IDS).join(", ");
const COOLDOWN_MS = { stock: 10000, crypto: 30000, bulk: 20000 };

const DEFAULT_GOALS = { finalGoalKRW: 2000000000, dividendGoalKRW: 80000000 };
const CASH_COLOR = "#3B82F6";
const CATEGORY_COLORS = { core: "#4FD1C5", satellite: "#FFB020", phase2: "#B18CFF", cash: CASH_COLOR };
const STATUS_META = { normal: { label: "정상", color: "#3DDC97" }, t1: { label: "2배 매수", color: "#FFB020" }, t2: { label: "BIL 집행", color: "#FF5C5C" }, done: { label: "목표 달성", color: "#60A5FA" } };

// 국내 주식 확장을 위한 isKRW 속성 추가
const HOLDING_DEFAULTS = { category: "core", isCrypto: false, isKRW: false, qty: 0, avgPrice: 0, price: 0, high52: 0, targetQty: 0, t1: -15, t2: -30, mdd: 0, divPerShare: 0 };
const PHASE2_DEFAULTS = { isKRW: false, qty: 0, avgPrice: 0, price: 0, high52: 0, divPerShare: 0 };

// 첫 사용자 온보딩을 위해 테슬라와 비트코인만 예시로 남김
const DEFAULT_HOLDINGS = [
  { id: "h1", ticker: "TSLA", name: "테슬라", category: "core", isCrypto: false, isKRW: false, qty: 0, avgPrice: 0, price: 400, high52: 463, targetQty: 100, t1: -25, t2: -40, mdd: -74, divPerShare: 0 },
  { id: "h2", ticker: "BTC", name: "비트코인", category: "satellite", isCrypto: true, isKRW: false, qty: 0, avgPrice: 0, price: 66509, high52: 124000, targetQty: 1, t1: -25, t2: -40, mdd: -84, divPerShare: 0 }
];

const DEFAULT_PHASE2 = [
  { id: "p1", ticker: "SCHD", name: "SCHD (배당 코어)", isKRW: false, qty: 0, avgPrice: 0, price: 32.92, high52: 33.50, divPerShare: 1.05 },
  { id: "p2", ticker: "SCHG", name: "SCHG (성장 코어)", isKRW: false, qty: 0, avgPrice: 0, price: 34.27, high52: 35.42, divPerShare: 0.12 }
];

// ═══ [2] UTILS ══════════════════════════════════════════════════════

const { useState, useEffect, useRef, useCallback, useMemo } = React;

function uid() { return "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toNum(v, fallback) { var n = Number(v); return isFinite(n) ? n : fallback; }
function toUSD(val, isKRW, fx) { return (isKRW && fx > 0) ? val / fx : val; }

function fmtCurrency(n, isKRW) {
  if (!isFinite(n)) n = 0;
  if (isKRW) return "₩" + Math.round(n).toLocaleString("ko-KR");
  return "$" + Math.round(n).toLocaleString("en-US");
}

function fmtKRWShort(n) {
  if (!isFinite(n)) return "0원";
  var sign = n < 0 ? "-" : "";
  var abs = Math.abs(n);
  if (abs >= 100000000) {
    var v = abs / 100000000;
    var t = v >= 100 ? Math.round(v).toLocaleString("ko-KR") : v.toFixed(2).replace(/\.?0+$/, "");
    return sign + t + "억원";
  }
  if (abs >= 10000) return sign + Math.round(abs / 10000).toLocaleString("ko-KR") + "만원";
  return sign + Math.round(abs).toLocaleString("ko-KR") + "원";
}

function isStale(iso, hours) {
  if (!iso) return true;
  var t = Date.parse(iso);
  if (!isFinite(t)) return true;
  return Date.now() - t > hours * 3600000;
}

function fmtSyncTime(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "-";
  var now = new Date();
  var hh = String(d.getHours()).padStart(2, "0");
  var mm = String(d.getMinutes()).padStart(2, "0");
  if (d.toDateString() === now.toDateString()) return hh + ":" + mm;
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + hh + ":" + mm;
}

// ═══ [3] STORAGE ════════════════════════════════════════════════════

function normalizeHolding(raw) {
  var h = Object.assign({}, HOLDING_DEFAULTS, raw || {});
  h.id = (typeof h.id === "string" && h.id) ? h.id : uid();
  h.ticker = String(h.ticker || "").toUpperCase();
  h.name = h.name || h.ticker;
  h.category = h.category === "satellite" ? "satellite" : "core";
  h.isCrypto = !!h.isCrypto;
  h.isKRW = !!h.isKRW;
  ["qty", "avgPrice", "price", "high52", "targetQty", "divPerShare"].forEach(function (k) { h[k] = Math.max(0, toNum(h[k], 0)); });
  ["t1", "t2", "mdd"].forEach(function (k) {
    var t = toNum(h[k], HOLDING_DEFAULTS[k]);
    h[k] = t === 0 ? 0 : -Math.abs(t);
  });
  return h;
}

function normalizePhase2(raw) {
  var p = Object.assign({}, PHASE2_DEFAULTS, raw || {});
  p.id = (typeof p.id === "string" && p.id) ? p.id : uid();
  p.ticker = String(p.ticker || "").toUpperCase();
  p.name = p.name || p.ticker;
  p.isKRW = !!p.isKRW;
  ["qty", "avgPrice", "price", "high52", "divPerShare"].forEach(function (k) { p[k] = Math.max(0, toNum(p[k], 0)); });
  return p;
}

function normalizeState(raw) {
  raw = raw || {};
  var goalsRaw = raw.goals || {};
  return {
    holdings: Array.isArray(raw.holdings) && raw.holdings.length ? raw.holdings.map(normalizeHolding) : DEFAULT_HOLDINGS.map(function (h) { return Object.assign({}, h); }),
    phase2: Array.isArray(raw.phase2) && raw.phase2.length ? raw.phase2.map(normalizePhase2) : DEFAULT_PHASE2.map(function (p) { return Object.assign({}, p); }),
    bilBalance: Math.max(0, toNum(raw.bilBalance, 0)),
    exchangeRate: toNum(raw.exchangeRate, 1480) > 0 ? toNum(raw.exchangeRate, 1480) : 1480,
    bilMinPct: Math.max(0, toNum(raw.bilMinPct, 10)),
    goals: { finalGoalKRW: Math.max(0, toNum(goalsRaw.finalGoalKRW, DEFAULT_GOALS.finalGoalKRW)), dividendGoalKRW: Math.max(0, toNum(goalsRaw.dividendGoalKRW, DEFAULT_GOALS.dividendGoalKRW)) },
    lastPriceSync: typeof raw.lastPriceSync === "string" ? raw.lastPriceSync : null,
    lastBackupAt: typeof raw.lastBackupAt === "string" ? raw.lastBackupAt : null,
    lastUpdated: typeof raw.lastUpdated === "string" ? raw.lastUpdated : null
  };
}

function serializeState(s) {
  return { schemaVersion: SCHEMA_VERSION, holdings: s.holdings, phase2: s.phase2, bilBalance: s.bilBalance, exchangeRate: s.exchangeRate, bilMinPct: s.bilMinPct, goals: s.goals, lastPriceSync: s.lastPriceSync, lastBackupAt: s.lastBackupAt, lastUpdated: new Date().toISOString() };
}

function loadPersistedState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { state: normalizeState(JSON.parse(raw)), migrated: false };
    for (var i = 0; i < LEGACY_STORAGE_KEYS.length; i++) {
      var legacy = localStorage.getItem(LEGACY_STORAGE_KEYS[i]);
      if (legacy) {
        var st = normalizeState(JSON.parse(legacy));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState(st))); } catch (e) {}
        return { state: st, migrated: true };
      }
    }
  } catch (e) { console.warn("데이터 파싱 오류", e); }
  return null;
}

// ═══ [4] MARKET API ═════════════════════════════════════════════════

var __cooldowns = {};
function underCooldown(key, ms) { return Date.now() - (__cooldowns[key] || 0) < ms; }
function markCooldown(key) { __cooldowns[key] = Date.now(); }
function cooldownLeft(key, ms) { return Math.max(1, Math.ceil((ms - (Date.now() - (__cooldowns[key] || 0))) / 1000)); }

async function fetchJson(url, options) {
  var res = await fetch(url, options);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// Worker 프록시 호출에만 붙이는 인증 헤더 (CoinGecko/환율 API에는 안 붙음)
function proxyOpts() {
  return { headers: { "X-Client-Key": CLIENT_KEY } };
}

async function apiQuote(ticker) {
  var d = await fetchJson(PROXY_URL + "?endpoint=quote&symbol=" + encodeURIComponent(ticker), proxyOpts());
  if (!d || (d.c === 0 && d.h === 0)) throw new Error("no quote");
  return { price: d.c, dayHigh: d.h || 0 };
}

async function apiMetric(ticker) {
  try {
    var d = await fetchJson(PROXY_URL + "?endpoint=metric&symbol=" + encodeURIComponent(ticker), proxyOpts());
    var m = d && d.metric;
    if (!m) return { div: null, high52: 0 };
    var div = typeof m.dividendPerShareTTM === "number" ? m.dividendPerShareTTM : (typeof m.dividendPerShareAnnual === "number" ? m.dividendPerShareAnnual : null);
    var high = typeof m["52WeekHigh"] === "number" ? m["52WeekHigh"] : 0;
    return { div: (typeof div === "number" && div >= 0) ? div : null, high52: high };
  } catch (e) { return { div: null, high52: 0 }; }
}

async function apiSearch(q) {
  var d = await fetchJson(PROXY_URL + "?endpoint=search&q=" + encodeURIComponent(q), proxyOpts());
  var all = (d && d.result) || [];
  // 한국 주식/ETF 검색 지원을 위해 .KS(코스피) 및 .KQ(코스닥) 필터 통과 허용
  var filtered = all.filter(function (s) {
    if (!s.symbol) return false;
    return s.symbol.indexOf(".") === -1 || s.symbol.endsWith(".KS") || s.symbol.endsWith(".KQ");
  });
  return (filtered.length ? filtered : all).slice(0, 6);
}

async function apiCryptoPrices(tickers) {
  var ids = [];
  tickers.forEach(function (t) { var id = CRYPTO_IDS[t]; if (id && ids.indexOf(id) === -1) ids.push(id); });
  if (!ids.length) return {};
  var d = await fetchJson(COINGECKO_URL + "?ids=" + ids.join(",") + "&vs_currencies=usd");
  var out = {};
  tickers.forEach(function (t) { var id = CRYPTO_IDS[t]; if (id && d[id] && typeof d[id].usd === "number") out[t] = d[id].usd; });
  return out;
}

async function apiFxKRW() {
  var d = await fetchJson(FX_URL);
  if (d && d.rates && typeof d.rates.KRW === "number") return Number(d.rates.KRW.toFixed(2));
  throw new Error("no fx");
}

// ═══ [5] CALC ═══════════════════════════════════════════════════════

function calcYield(a) { return (!a.avgPrice || a.qty <= 0) ? 0 : ((a.price - a.avgPrice) / a.avgPrice) * 100; }
function calcProfit(a) { return (!a.avgPrice || a.qty <= 0) ? 0 : (a.price - a.avgPrice) * a.qty; }
function dropPct(a) { return (!a.high52 || a.high52 <= 0) ? 0 : ((a.price - a.high52) / a.high52) * 100; }

function statusOf(h) {
  if ((h.targetQty || 0) > 0 && h.qty >= h.targetQty) return "done";
  var d = dropPct(h);
  if (typeof h.t2 === "number" && h.t2 < 0 && d <= h.t2) return "t2";
  if (typeof h.t1 === "number" && h.t1 < 0 && d <= h.t1) return "t1";
  return "normal";
}

function applyQuoteToAsset(a, q) {
  var next = Object.assign({}, a, { price: q.price });
  next.high52 = Math.max(toNum(a.high52, 0), q.price, toNum(q.dayHigh, 0), toNum(q.metricHigh, 0));
  if (q.div != null) next.divPerShare = q.div;
  return next;
}

function computeSummary(s) {
  var holdings = s.holdings, phase2 = s.phase2, bilBalance = s.bilBalance;
  var exchangeRate = s.exchangeRate, bilMinPct = s.bilMinPct, goals = s.goals;

  // 모든 가치 계산 시 한국 주식(isKRW)은 환율을 나누어 달러(USD) 장부로 일원화
  var phase1TargetUSD = holdings.reduce(function (sum, h) { return sum + toUSD((h.targetQty || 0) * h.price, h.isKRW, exchangeRate); }, 0);
  var phase1CurrentUSD = holdings.reduce(function (sum, h) { return sum + toUSD(h.qty * h.price, h.isKRW, exchangeRate); }, 0);
  var phase1Progress = phase1TargetUSD > 0 ? Math.min(100, (phase1CurrentUSD / phase1TargetUSD) * 100) : 0;
  var phase1Done = phase1TargetUSD > 0 && phase1CurrentUSD >= phase1TargetUSD;

  var phase2ValueUSD = phase2.reduce(function (sum, p) { return sum + toUSD(p.qty * p.price, p.isKRW, exchangeRate); }, 0);
  var phase2InvestedUSD = phase2.reduce(function (sum, p) { return sum + toUSD(p.qty * (p.avgPrice || 0), p.isKRW, exchangeRate); }, 0);
  var phase2ProfitUSD = phase2ValueUSD - phase2InvestedUSD;

  var annualDividendUSD =
    holdings.reduce(function (sum, h) { return sum + toUSD(h.qty * (h.divPerShare || 0), h.isKRW, exchangeRate); }, 0) +
    phase2.reduce(function (sum, p) { return sum + toUSD(p.qty * (p.divPerShare || 0), p.isKRW, exchangeRate); }, 0);
  
  var annualDividendKRW = annualDividendUSD * exchangeRate;
  var dividendProgress = goals.dividendGoalKRW > 0 ? Math.min(100, (annualDividendKRW / goals.dividendGoalKRW) * 100) : 0;
  var dividendGoalReached = goals.dividendGoalKRW > 0 && annualDividendKRW >= goals.dividendGoalKRW;

  var phase1InvestedUSD = holdings.reduce(function (sum, h) { return sum + toUSD(h.qty * (h.avgPrice || 0), h.isKRW, exchangeRate); }, 0);
  var phase1ProfitUSD = phase1CurrentUSD - phase1InvestedUSD;
  var totalInvestedUSD = phase1InvestedUSD + phase2InvestedUSD;
  var totalValueUSD = phase1CurrentUSD + phase2ValueUSD + bilBalance;
  var bilPctOfTotal = totalValueUSD > 0 ? (bilBalance / totalValueUSD) * 100 : 0;
  var bilLow = totalValueUSD > 0 && bilPctOfTotal < bilMinPct;
  var totalValueKRW = totalValueUSD * exchangeRate;
  var totalProfitUSD = phase1ProfitUSD + phase2ProfitUSD;
  var totalYieldPct = totalInvestedUSD > 0 ? (totalProfitUSD / totalInvestedUSD) * 100 : 0;

  var phase1KRW = phase1CurrentUSD * exchangeRate;
  var phase2KRW = phase2ValueUSD * exchangeRate;
  var cashKRW = bilBalance * exchangeRate;
  var combinedKRW = phase1KRW + phase2KRW + cashKRW;
  var finalProgress = goals.finalGoalKRW > 0 ? Math.min(100, (combinedKRW / goals.finalGoalKRW) * 100) : 0;
  var seg1 = goals.finalGoalKRW > 0 ? Math.min(100, (phase1KRW / goals.finalGoalKRW) * 100) : 0;
  var seg2 = goals.finalGoalKRW > 0 ? Math.min(100 - seg1, (phase2KRW / goals.finalGoalKRW) * 100) : 0;
  var seg3 = goals.finalGoalKRW > 0 ? Math.min(100 - seg1 - seg2, (cashKRW / goals.finalGoalKRW) * 100) : 0;

  var coreValueUSD = 0, satelliteValueUSD = 0;
  holdings.forEach(function (h) {
    var v = toUSD(h.qty * h.price, h.isKRW, exchangeRate);
    if (h.category === "core") coreValueUSD += v;
    else satelliteValueUSD += v;
  });
  var totalForBar = coreValueUSD + satelliteValueUSD + phase2ValueUSD + bilBalance || 1;
  var corePct = (coreValueUSD / totalForBar) * 100;
  var satellitePct = (satelliteValueUSD / totalForBar) * 100;
  var phase2Pct = (phase2ValueUSD / totalForBar) * 100;
  var cashPct = (bilBalance / totalForBar) * 100;

  var weights = {};
  var wBase = totalValueUSD > 0 ? totalValueUSD : 1;
  holdings.forEach(function (h) { weights[h.id] = (toUSD(h.qty * h.price, h.isKRW, exchangeRate) / wBase) * 100; });
  phase2.forEach(function (p) { weights[p.id] = (toUSD(p.qty * p.price, p.isKRW, exchangeRate) / wBase) * 100; });
  weights.bil = (bilBalance / wBase) * 100;

  var actionItems = holdings
    .map(function (h) { return { h: h, status: statusOf(h), drop: dropPct(h) }; })
    .filter(function (x) { return x.status === "t1" || x.status === "t2"; })
    .sort(function (a, b) { return a.drop - b.drop; });
  var triggeredCount = actionItems.length;
  var currentPhaseIdx = dividendGoalReached ? 2 : (phase1Done ? 1 : 0);
  var isEmpty = phase1CurrentUSD === 0 && phase2ValueUSD === 0;

  return { exchangeRate, phase1Progress, phase1Done, phase1CurrentUSD, phase2ValueUSD, phase2ProfitUSD, annualDividendKRW, dividendProgress, dividendGoalReached, totalInvestedUSD, totalValueUSD, totalValueKRW, totalProfitUSD, totalYieldPct, phase1KRW, phase2KRW, cashKRW, finalProgress, seg1, seg2, seg3, coreValueUSD, satelliteValueUSD, corePct, satellitePct, phase2Pct, cashPct, bilPctOfTotal, bilLow, actionItems, triggeredCount, currentPhaseIdx, weights, isEmpty };
}

// ═══ [6] 공용 UI ═════════════════════════════════════════════════════

const IconBase = ({ size = 16, color = "currentColor", children, className = "", style = {} }) => (

function useArmed(ms) {
  const [armed, setArmed] = useState(false);
  const timer = useRef(null);
  useEffect(function () { return function () { if (timer.current) clearTimeout(timer.current); }; }, []);
  function fire(cb) {
    if (!armed) {
      setArmed(true);
      if (timer.current) clearTimeout(timer.current);
      timer.current = setTimeout(function () { setArmed(false); }, ms || 2500);
      return false;
    }
    if (timer.current) clearTimeout(timer.current);
    setArmed(false);
    cb();
    return true;
  }
  return [armed, fire];
}

function Field({ label, value, onChange, negative, hint }) {
  function numToText(v) {
    var n = (typeof v === "number" && isFinite(v)) ? v : 0;
    return String(negative ? Math.abs(n) : n);
  }
  const [text, setText] = useState(numToText(value));
  const focused = useRef(false);
  useEffect(function () { if (!focused.current) setText(numToText(value)); }, [value, negative]);

  function handleChange(e) {
    var raw = e.target.value.replace(/[^0-9.]/g, "");
    var firstDot = raw.indexOf(".");
    if (firstDot !== -1) raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, "");
    setText(raw);
    if (raw === "" || raw === ".") { onChange(0); return; }
    var n = parseFloat(raw);
    if (isFinite(n)) onChange(negative ? -n : n);
  }

  return (
    <div>
      <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>{label}</div>
      <div className="fld flex items-center rounded" style={{ background: "#0B0E11", border: "1px solid #1F262D" }}>
        {negative && <span className="mono pl-2" style={{ color: "#8B96A5", fontSize: "13px" }}>-</span>}
        <input type="text" inputMode="decimal" value={text} onFocus={(e) => { focused.current = true; e.target.select(); }} onBlur={() => { focused.current = false; setText(numToText(value)); }} onChange={handleChange} className="mono w-full text-sm px-2 py-1.5" style={{ color: "#E8ECEF", border: "none", background: "transparent" }} />
      </div>
      {hint && <div className="mt-0.5" style={{ color: "#4A535C", fontSize: "9px" }}>{hint}</div>}
    </div>
  );
}

function DonutChart({ segments, size = 148, strokeWidth = 20 }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#1A2027" strokeWidth={strokeWidth} />
      {segments.map((seg, i) => {
        const pct = seg.value / total;
        if (pct <= 0) return null;
        const dash = pct * circumference;
        const gap = circumference - dash;
        const rotation = (acc / total) * 360 - 90;
        acc += seg.value;
        return <circle key={i} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={seg.color} strokeWidth={strokeWidth} strokeDasharray={`${dash} ${gap}`} strokeLinecap="butt" transform={`rotate(${rotation} ${size / 2} ${size / 2})`} />;
      })}
    </svg>
  );
}

          <div className="grid grid-cols-3 gap-2 mt-3">
            <Field label="수량" value={h.qty} onChange={(v) => onChange("qty", v)} />

          <div className="grid grid-cols-3 gap-2 mt-2 pt-2" style={{ borderTop: "1px dashed #1F262D" }}>

            <Field label="2차 트리거(%)" negative value={h.t2 || 0} onChange={(v) => onChange("t2", v)} />

          <div className="mt-1" style={{ color: "#4A535C", fontSize: "9px" }}>고점 대비 하락률 기준 · 0 입력 시 해당 트리거 미사용</div>

          <div className="grid grid-cols-2 gap-2 mt-2">
            <Field label={`연배당(${sym}/주)`} value={h.divPerShare || 0} onChange={(v) => onChange("divPerShare", v)} />
            <div>
              <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>예상 연배당</div>
              <div className="mono text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#60A5FA" }}>{fmtCurrency(h.qty * (h.divPerShare || 0), h.isKRW)}</div>

            <div>

                <span className="mono" style={{ color: d <= 0 ? "#FF5C5C" : "#3DDC97", fontSize: "12px", fontWeight: "bold" }}>현재하락 {d.toFixed(1)}%</span>
                <span className="mono" style={{ color: "#5C666F", fontSize: "10px" }}>(최악기준 {h.mdd || 0}%)</span>
              </div>
              {h.qty > 0 && h.avgPrice > 0 && (
                <div className="mono mt-0.5" style={{ color: yld >= 0 ? "#3DDC97" : "#FF5C5C", fontSize: "12px" }}>

              )}
            </div>
            <div className="text-right mono" style={{ color: "#8B96A5", fontSize: "11px" }}>비중 {(weightPct || 0).toFixed(1)}%</div>

          {targetQty > 0 && (
            <div className="mt-3 pt-3" style={{ borderTop: "1px solid #1F262D" }}>
              <div className="flex justify-between mb-1" style={{ color: "#8B96A5", fontSize: "11px" }}>
                <span>수량 달성률 (목표 {targetQty}주)</span>
                <span className="mono">{targetProgress.toFixed(0)}%</span>
              </div>
              <div className="w-full rounded-full h-1.5 mb-1.5" style={{ background: "#1A2027" }}>
                <div className="h-1.5 rounded-full" style={{ width: `${targetProgress}%`, background: remainingQty <= 0 ? "#3DDC97" : "#4FD1C5" }} />
              </div>
              <div className="mono" style={{ color: remainingQty <= 0 ? "#3DDC97" : "#B8C1CA", fontSize: "12px" }}>
                {remainingQty <= 0 ? "✅ 수량 목표 달성!" : `목표까지 ${remainingQty}주 남음 (약 ${fmtCurrency(remainingAmount, h.isKRW)} 필요)`}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// 🛡️ 보완: 디바운스 속도 단축 (350ms -> 200ms) 및 자동추천 UI 스타일 개선
function AddHoldingForm({ onAdd, onCancel }) {
  const [ticker, setTicker] = useState("");
  const [name, setName] = useState("");
  const [category, setCategory] = useState("core");
  const [isCrypto, setIsCrypto] = useState(false);
  const [isKRW, setIsKRW] = useState(false);
  const [qty, setQty] = useState(0);
  const [avgPrice, setAvgPrice] = useState(0);
  const [price, setPrice] = useState(0);
  const [high52, setHigh52] = useState(0);
  const [targetQty, setTargetQty] = useState(0);
  const [t1, setT1] = useState(-15);
  const [t2, setT2] = useState(-30);
  const [mdd, setMdd] = useState(0);
  const [divPerShare, setDivPerShare] = useState(0);

  const [suggestions, setSuggestions] = useState([]);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [searching, setSearching] = useState(false);
  const [autoFilling, setAutoFilling] = useState(false);
  const [autoFilled, setAutoFilled] = useState(false);
  const [note, setNote] = useState("");
  const searchTimer = useRef(null);

  useEffect(() => {
    if (isCrypto || ticker.trim().length < 1) { setSuggestions([]); setShowSuggestions(false); return; }
    if (searchTimer.current) clearTimeout(searchTimer.current);
    searchTimer.current = setTimeout(async () => {
      setSearching(true);
      try {
        const list = await apiSearch(ticker);
        setSuggestions(list);
        setShowSuggestions(list.length > 0);
      } catch (e) {} finally { setSearching(false); }
    }, 200); // 🚀 반응 속도 개선
    return () => { if (searchTimer.current) clearTimeout(searchTimer.current); };
  }, [ticker, isCrypto]);

  useEffect(() => {
    if (ticker.endsWith(".KS") || ticker.endsWith(".KQ")) setIsKRW(true);
  }, [ticker]);

  async function selectSuggestion(item) {
    setTicker(item.symbol);
    setName(item.description || item.symbol);
    setShowSuggestions(false);
    setSuggestions([]);
    setAutoFilled(false);
    setNote("");
    setAutoFilling(true);
    try {
      var isKorean = item.symbol.endsWith(".KS") || item.symbol.endsWith(".KQ");
      if (isKorean) setIsKRW(true);
      
      const q = await apiQuote(item.symbol).catch(() => null);
      if (q) {
        setPrice(q.price);
        setHigh52(Math.max(q.price, q.dayHigh || 0));
      }
      const m = await apiMetric(item.symbol);
      if (m.div != null) setDivPerShare(m.div);
      if (m.high52 > 0) setHigh52((prev) => Math.max(prev, m.high52));
      setAutoFilled(true);
    } catch (e) {
      setNote("자동 채우기 실패 — 시세를 직접 입력해 주세요");
    } finally {
      setAutoFilling(false);
    }
  }

  async function fillCryptoPrice() {
    const t = ticker.trim().toUpperCase();
    if (!t) return;
    if (!CRYPTO_IDS[t]) { setNote("자동 시세 미지원 코인이에요 · 직접 입력 (지원: " + SUPPORTED_COINS_LABEL + ")"); return; }
    setAutoFilling(true); setNote("");
    try {
      const prices = await apiCryptoPrices([t]);
      if (prices[t] == null) throw new Error("no price");
      setPrice(prices[t]); setHigh52((prev) => Math.max(prev, prices[t]));
      setAutoFilled(true);
    } catch (e) { setNote("코인 시세 조회 실패 — 직접 입력해 주세요"); } finally { setAutoFilling(false); }
  }

  return (
    <div className="panel rounded-lg p-4 mb-2 space-y-3">
      <div className="grid grid-cols-2 gap-2">
        <div className="relative">
          <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>티커 {!isCrypto && <span style={{ color: "#4A535C" }}>· 몇 글자만 입력하면 자동 검색돼요</span>}</div>
          <input value={ticker} onChange={(e) => { setTicker(e.target.value.toUpperCase()); setAutoFilled(false); }} onFocus={() => setShowSuggestions(suggestions.length > 0)} onBlur={() => setTimeout(() => setShowSuggestions(false), 150)} className="tinput mono w-full text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#E8ECEF" }} />
          {searching && <div style={{ position: "absolute", right: 8, top: 30, fontSize: "10px", color: "#5C666F" }}>검색중</div>}
          
          {/* 🛡️ 보완: UI 및 가독성 개선된 자동완성 목록 */}
          {showSuggestions && (
            <div className="absolute z-20 w-[140%] mt-1 rounded-md overflow-hidden" 
                 style={{ 
                   background: "rgba(15, 23, 31, 0.95)", 
                   backdropFilter: "blur(10px)",
                   border: "1px solid #2B3544", 
                   maxHeight: "220px", 
                   overflowY: "auto",
                   boxShadow: "0 10px 25px rgba(0,0,0,0.6)"
                 }}>
              {suggestions.map((s, index) => (
                <button key={s.symbol} type="button" onClick={() => selectSuggestion(s)} 
                        className="w-full text-left px-3 py-2.5 hover:bg-[#162B29] transition-colors duration-150" 
                        style={{ fontSize: "11px", color: "#E8ECEF", borderBottom: index < suggestions.length - 1 ? "1px solid #252F3A" : "none" }}>
                  <span className="mono font-bold text-[#4FD1C5]">{s.symbol}</span> 
                  <span className="ml-1" style={{ color: "#8B96A5" }}>{s.description}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>이름</div>
          <input value={name} onChange={(e) => setName(e.target.value)} className="tinput w-full text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#E8ECEF" }} />
        </div>
      </div>
      {autoFilling && <div style={{ color: "#4FD1C5", fontSize: "11px" }}>시세·배당 자동으로 채우는 중...</div>}
      {autoFilled && !autoFilling && <div style={{ color: "#3DDC97", fontSize: "11px" }}>현재가·52주고가·배당을 자동으로 채웠어요 · 필요하면 직접 수정하세요</div>}
      {note && !autoFilling && <div style={{ color: "#FFB020", fontSize: "11px" }}>{note}</div>}
      <div className="grid grid-cols-3 gap-2">
        <Field label="수량" value={qty} onChange={setQty} />
        <Field label={`평단가(${isKRW ? '₩' : '$'})`} value={avgPrice} onChange={setAvgPrice} />
        <Field label={`현재가(${isKRW ? '₩' : '$'})`} value={price} onChange={setPrice} />
      </div>
      <div className="grid grid-cols-2 gap-2">
        <Field label={`52주 고가(${isKRW ? '₩' : '$'})`} value={high52} onChange={setHigh52} />
        <Field label="목표수량(주/개)" value={targetQty} onChange={setTargetQty} />
      </div>
      <div className="grid grid-cols-3 gap-2 pt-2" style={{ borderTop: "1px dashed #1F262D" }}>
        <Field label="1차 트리거(%)" negative value={t1} onChange={setT1} />
        <Field label="2차 트리거(%)" negative value={t2} onChange={setT2} />
        <Field label="과거 MDD(%)" negative value={mdd} onChange={setMdd} />
      </div>
      <Field label={`연배당(${isKRW ? '₩' : '$'}/주)`} value={divPerShare} onChange={setDivPerShare} />
      <div className="flex items-center gap-4 flex-wrap">
        <label className="flex items-center gap-1.5" style={{ color: "#B8C1CA", fontSize: "12px" }}>
          <input type="checkbox" checked={category === "satellite"} onChange={(e) => setCategory(e.target.checked ? "satellite" : "core")} /> 위성자산
        </label>
        <label className="flex items-center gap-1.5" style={{ color: "#B8C1CA", fontSize: "12px" }}>
          <input type="checkbox" checked={isCrypto} onChange={(e) => { setIsCrypto(e.target.checked); setNote(""); }} /> 코인
        </label>
        <label className="flex items-center gap-1.5" style={{ color: "#B8C1CA", fontSize: "12px" }}>
          <input type="checkbox" checked={isKRW} onChange={(e) => { setIsKRW(e.target.checked); setNote(""); }} /> 국내 상장(KRW)
        </label>
        {isCrypto && (
          <button type="button" onClick={fillCryptoPrice} disabled={autoFilling} className="px-2 py-1 rounded hover:bg-gray-800" style={{ background: "#1A2027", color: "#4FD1C5", fontSize: "11px", border: "1px solid #1F262D" }}>
            코인 현재가 불러오기
          </button>
        )}
      </div>
      <div className="flex gap-2 pt-1">
        <button onClick={() => { if (ticker) onAdd({ ticker: ticker.trim().toUpperCase(), name: name || ticker, category, isCrypto, isKRW, qty, avgPrice, price, high52, targetQty, t1, t2, mdd, divPerShare }); }} className="flex-1 py-2.5 rounded-md font-bold hover:bg-teal-400" style={{ background: "#4FD1C5", color: "#0B0E11", fontSize: "12px" }}>추가</button>
        <button onClick={onCancel} className="flex-1 py-2.5 rounded-md hover:bg-gray-800" style={{ background: "#1A2027", color: "#8B96A5", fontSize: "12px" }}>취소</button>
      </div>
    </div>
  );
}

        </div>

        <div className="pt-3" style={{ borderTop: "1px solid #1F262D" }}>
          <button onClick={() => fireReset(onResetAll)} className="w-full py-2 rounded-md" style={{ background: resetArmed ? "#3A171B" : "#1A2027", color: resetArmed ? "#FF5C5C" : "#8B96A5", fontSize: "12px", border: "1px solid " + (resetArmed ? "#4A2126" : "#1F262D") }}>
            {resetArmed ? "정말 초기화할까요? 한 번 더 누르면 실행돼요" : "전체 데이터 초기화"}
          </button>
        </div>

        <div className="pt-1">
          <button onClick={onClose} className="w-full py-2.5 rounded-md font-bold text-center hover:bg-teal-400" style={{ background: "#4FD1C5", color: "#0B0E11", fontSize: "13px" }}>설정 완료 닫기</button>
        </div>
      </div>
    </div>
  );
}

// ═══ [8] APP ════════════════════════════════════════════════════════

function PortfolioConsole() {
  const [holdings, setHoldings] = useState(() => DEFAULT_HOLDINGS.map((h) => Object.assign({}, h)));
  const [phase2, setPhase2] = useState(() => DEFAULT_PHASE2.map((p) => Object.assign({}, p)));
  const [bilBalance, setBilBalance] = useState(0);
  const [exchangeRate, setExchangeRate] = useState(1480);
  const [bilMinPct, setBilMinPct] = useState(10);
  const [goals, setGoals] = useState(() => Object.assign({}, DEFAULT_GOALS));
  const [lastPriceSync, setLastPriceSync] = useState(null);
  const [lastBackupAt, setLastBackupAt] = useState(null);

  const [loaded, setLoaded] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showRules, setShowRules] = useState(true);
  const [showAddForm, setShowAddForm] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [busyKey, setBusyKey] = useState(null);
  const [bulk, setBulk] = useState(null);
  const [fxBusy, setFxBusy] = useState(false);
  const [hasRefreshedThisSession, setHasRefreshedThisSession] = useState(false);
  const [expandedIds, setExpandedIds] = useState({});
  const [toasts, setToasts] = useState([]);

  const saveTimer = useRef(null);
  const cardRefs = useRef({});
  const bilCardRef = useRef(null);
  const toastSeq = useRef(0);

  const removeToast = useCallback((id) => setToasts((p) => p.filter((t) => t.id !== id)), []);
  const toast = useCallback((type, msg, ms) => {
    var id = ++toastSeq.current;
    setToasts((p) => p.slice(-3).concat([{ id: id, type: type, msg: msg }]));
    var life = ms || (type === "error" ? 6000 : type === "warn" ? 5000 : 3200);
    setTimeout(function () { removeToast(id); }, life);
  }, [removeToast]);

  useEffect(() => {
    var res = loadPersistedState();
    if (res) {
      var st = res.state;
      setHoldings(st.holdings);
      setPhase2(st.phase2);
      setBilBalance(st.bilBalance);
      setExchangeRate(st.exchangeRate);
      setBilMinPct(st.bilMinPct);
      setGoals(st.goals);
      setLastPriceSync(st.lastPriceSync);
      setLastBackupAt(st.lastBackupAt);
      if (st.lastUpdated) setLastSaved(st.lastUpdated);
      if (res.migrated) toast("info", "기존 데이터를 새 버전(v8)으로 옮겨왔어요");
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      var payload = serializeState({ holdings, phase2, bilBalance, exchangeRate, bilMinPct, goals, lastPriceSync, lastBackupAt });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        setSaveError(false);
        setLastSaved(payload.lastUpdated);
      } catch (e) {
        setSaveError(true);
      }
    }, 700);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [holdings, phase2, bilBalance, exchangeRate, bilMinPct, goals, lastPriceSync, lastBackupAt, loaded]);

  const makeFieldUpdater = (setList) => (id, field, v) => {
    setList((prev) => prev.map((x) => {
      if (x.id !== id) return x;
      if (field === "price") return Object.assign({}, x, { price: v, high52: Math.max(v, toNum(x.high52, 0)) });
      var o = Object.assign({}, x);
      o[field] = v;
      return o;
    }));
  };
  const changeHolding = useMemo(() => makeFieldUpdater(setHoldings), []);
  const changePhase2 = useMemo(() => makeFieldUpdater(setPhase2), []);

  function removeHoldingById(id) {
    setHoldings((prev) => prev.filter((h) => h.id !== id));
    toast("info", "종목을 삭제했어요");
  }

  function addHolding(nh) {
    var normalized = normalizeHolding(Object.assign({}, nh, { id: uid() }));
    var dup = holdings.concat(phase2).some((x) => x.ticker === normalized.ticker);
    setHoldings((prev) => prev.concat([normalized]));
    setShowAddForm(false);
    if (dup) toast("warn", normalized.ticker + " — 같은 티커가 이미 있어요 (중복으로 추가됨)");
    else toast("success", normalized.ticker + " 추가 완료");
  }

  function toggleExpand(id) { setExpandedIds((prev) => Object.assign({}, prev, { [id]: !prev[id] })); }
  function jumpToHolding(id) {
    setExpandedIds((prev) => Object.assign({}, prev, { [id]: true }));
    setTimeout(() => {
      var el = cardRefs.current[id];
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 50);
  }
  function jumpToBil() {
    if (bilCardRef.current) bilCardRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function applyToList(scope, id, q) {
    var upd = (list) => list.map((x) => (x.id === id ? applyQuoteToAsset(x, q) : x));
    if (scope === "holding") setHoldings(upd);
    else setPhase2(upd);
  }

  async function refreshAsset(asset, scope) {
    if (bulk) { toast("info", "전체 갱신이 진행 중이에요"); return; }
    if (asset.isCrypto) {
      if (!CRYPTO_IDS[asset.ticker]) {
        toast("warn", asset.ticker + "는 자동 시세 미지원 코인이에요 · 직접 입력 (지원: " + SUPPORTED_COINS_LABEL + ")");
        return;
      }
      var ckey = "crypto:" + asset.ticker;
      if (underCooldown(ckey, COOLDOWN_MS.crypto)) {
        toast("info", asset.ticker + " 재조회는 " + cooldownLeft(ckey, COOLDOWN_MS.crypto) + "초 후에 가능해요");
        return;
      }
      setBusyKey(asset.id);
      try {
        var prices = await apiCryptoPrices([asset.ticker]);
        if (prices[asset.ticker] == null) throw new Error("no price");
        applyToList(scope, asset.id, { price: prices[asset.ticker], dayHigh: 0, metricHigh: 0, div: null });
        markCooldown(ckey);
        setLastPriceSync(new Date().toISOString());
      } catch (e) {
        toast("error", asset.ticker + " 시세 조회 실패 — 잠시 후 다시 시도하거나 직접 입력해 주세요");
      } finally {
        setBusyKey(null);
      }
      return;
    }
    var skey = "stock:" + asset.ticker;
    if (underCooldown(skey, COOLDOWN_MS.stock)) {
      toast("info", asset.ticker + " 재조회는 " + cooldownLeft(skey, COOLDOWN_MS.stock) + "초 후에 가능해요");
      return;
    }
    setBusyKey(asset.id);
    try {
      var results = await Promise.all([apiQuote(asset.ticker), apiMetric(asset.ticker)]);
      applyToList(scope, asset.id, { price: results[0].price, dayHigh: results[0].dayHigh, metricHigh: results[1].high52, div: results[1].div });
      markCooldown(skey);
      setLastPriceSync(new Date().toISOString());
    } catch (e) {
      toast("error", asset.ticker + " 조회 실패 — 티커를 확인해 주세요");
    } finally {
      setBusyKey(null);
    }
  }

  async function refreshAllPrices() {
    if (bulk) return;
    if (underCooldown("bulk", COOLDOWN_MS.bulk)) {
      toast("info", "전체 갱신은 " + cooldownLeft("bulk", COOLDOWN_MS.bulk) + "초 후에 다시 가능해요");
      return;
    }
    var stockTargets = holdings.filter((h) => !h.isCrypto).map((h) => ({ scope: "holding", id: h.id, ticker: h.ticker }))
      .concat(phase2.map((p) => ({ scope: "phase2", id: p.id, ticker: p.ticker })));
    var cryptoTickers = [];
    holdings.forEach((h) => { if (h.isCrypto && cryptoTickers.indexOf(h.ticker) === -1) cryptoTickers.push(h.ticker); });

    var total = stockTargets.length + (cryptoTickers.length ? 1 : 0) + 1;
    setBulk({ done: 0, total: total });
    var failed = [];
    var step = () => setBulk((b) => (b ? { done: b.done + 1, total: b.total } : b));

    var currentFx = exchangeRate;
    try { currentFx = await apiFxKRW(); setExchangeRate(currentFx); } catch (e) { failed.push("환율"); }
    step();

    if (cryptoTickers.length) {
      try {
        var cp = await apiCryptoPrices(cryptoTickers);
        setHoldings((prev) => prev.map((x) => {
          if (!x.isCrypto) return x;
          var pr = cp[x.ticker];
          return pr == null ? x : applyQuoteToAsset(x, { price: pr, dayHigh: 0, metricHigh: 0, div: null });
        }));
        cryptoTickers.forEach((t) => { if (cp[t] == null) failed.push(t); });
      } catch (e) {
        failed.push("코인 일괄");
      }
      step();
    }

    for (var i = 0; i < stockTargets.length; i++) {
      var tgt = stockTargets[i];
      try {
        var r = await Promise.all([apiQuote(tgt.ticker), apiMetric(tgt.ticker)]);
        applyToList(tgt.scope, tgt.id, { price: r[0].price, dayHigh: r[0].dayHigh, metricHigh: r[1].high52, div: r[1].div });
      } catch (e) {
        failed.push(tgt.ticker);
      }
      step();
      await new Promise((res) => setTimeout(res, 250));
    }

    markCooldown("bulk");
    setLastPriceSync(new Date().toISOString());
    setBulk(null);
    setHasRefreshedThisSession(true);
    if (failed.length) toast("warn", "일부 조회 실패: " + failed.join(", "));
    else toast("success", "전체 시세 갱신 완료");
  }

  async function fetchFx() {
    setFxBusy(true);
    try {
      setExchangeRate(await apiFxKRW());
      toast("success", "환율을 갱신했어요");
    } catch (e) {
      toast("error", "환율 자동 조회 실패 — 직접 입력해 주세요");
    } finally {
      setFxBusy(false);
    }
  }

  function handleExportData() {
    try {
      var payload = serializeState({ holdings, phase2, bilBalance, exchangeRate, bilMinPct, goals, lastPriceSync, lastBackupAt });
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "portfolio_backup_" + new Date().toISOString().split("T")[0] + ".json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      setLastBackupAt(new Date().toISOString());
      toast("success", "백업 파일을 내보냈어요");
    } catch (e) {
      toast("error", "백업 파일 생성에 실패했어요");
    }
  }

  function handleImportData(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    var reader = new FileReader();
    reader.onload = (evt) => {
      try {
        var data = JSON.parse(evt.target.result);
        if (!data || !Array.isArray(data.holdings)) {
          toast("error", "유효하지 않은 백업 파일이에요 — holdings 항목이 없어요");
          return;
        }
        var st = normalizeState(data);
        setHoldings(st.holdings);
        setPhase2(st.phase2);
        setBilBalance(st.bilBalance);
        setExchangeRate(st.exchangeRate);
        setBilMinPct(st.bilMinPct);
        setGoals(st.goals);
        setLastPriceSync(st.lastPriceSync);
        setLastBackupAt(st.lastBackupAt);
        toast("success", "백업 복원 완료 · 종목 " + st.holdings.length + "개");
      } catch (err) {
        toast("error", "파일을 읽지 못했어요 — JSON 형식을 확인해 주세요");
      }
    };
    reader.readAsText(file);
  }

  function handleResetAll() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setHoldings(DEFAULT_HOLDINGS.map((h) => Object.assign({}, h)));
    setPhase2(DEFAULT_PHASE2.map((p) => Object.assign({}, p)));
    setBilBalance(0);
    setExchangeRate(1480);
    setBilMinPct(10);
    setGoals(Object.assign({}, DEFAULT_GOALS));
    setLastPriceSync(null);
    setLastBackupAt(null);
    setExpandedIds({});
    toast("success", "전체 데이터를 초기화했어요");
  }

  const summary = useMemo(() => computeSummary({ holdings, phase2, bilBalance, exchangeRate, bilMinPct, goals }), [holdings, phase2, bilBalance, exchangeRate, bilMinPct, goals]);
  const priceStale = lastPriceSync && isStale(lastPriceSync, 20);
  const needsInitialSync = !hasRefreshedThisSession && isStale(lastPriceSync, 1);
  const backupStale = !lastBackupAt || isStale(lastBackupAt, 24 * 30);

  return (
    <div style={{ fontFamily: "'Noto Sans KR', sans-serif", background: "#0B0E11", minHeight: "100vh", color: "#E8ECEF", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 64px)" }} className="w-full min-h-screen relative">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .mono { font-family: 'JetBrains Mono', monospace; }
        .panel { background: #12161B; border: 1px solid #1F262D; }
        .led { box-shadow: 0 0 8px 1px currentColor; }
        * { -webkit-tap-highlight-color: transparent; }
        button, label { touch-action: manipulation; }
        input { outline: none; }
        .fld:focus-within { border-color: #4FD1C5 !important; }
        .tinput:focus { border-color: #4FD1C5 !important; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #1F262D; border-radius: 2px; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.45); } 50% { box-shadow: 0 0 0 10px rgba(79, 209, 197, 0); } }
        .pulse-cta { animation: pulseGlow 1.8s ease-in-out infinite; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast-item { animation: toastIn 0.18s ease-out; }
      `}</style>

      <div style={{ position: "sticky", top: 0, zIndex: 40, background: "rgba(11,14,17,0.92)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", borderBottom: "1px solid #1F262D", paddingTop: "env(safe-area-inset-top, 0px)" }}>
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
          <div>
            <div className="flex items-center gap-2">
              <span className="mono tracking-widest" style={{ color: "#4FD1C5", fontSize: "11px" }}>{APP_VERSION}</span>
              {lastPriceSync && (
                <span className="mono" style={{ color: priceStale ? "#FFB020" : "#5C666F", fontSize: "10px" }}>
                  시세 {fmtSyncTime(lastPriceSync)}{priceStale ? " · 오래됨" : ""}
                </span>
              )}
            </div>
            <div className="text-lg font-bold">자산 관제 콘솔</div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={refreshAllPrices} disabled={!!bulk} aria-label="전체 시세 갱신" className="p-2 rounded-md hover:bg-gray-800 flex items-center gap-1.5" style={{ background: "#1A2027", minHeight: 40 }}>
              <RefreshCw size={17} color="#4FD1C5" className={bulk ? "animate-spin" : ""} />
              <span className="mono" style={{ color: "#4FD1C5", fontSize: "11px" }}>{bulk ? bulk.done + "/" + bulk.total : "전체갱신"}</span>
            </button>
            <button onClick={() => setShowSettings(true)} aria-label="환경 설정" className="p-2 rounded-md hover:bg-gray-800" style={{ background: "#1A2027", minHeight: 40, minWidth: 40 }}>
              <Settings size={17} color="#8B96A5" />
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 pt-5 space-y-5">
        {needsInitialSync && (
          <button onClick={refreshAllPrices} disabled={!!bulk} className="w-full rounded-lg p-4 flex items-center justify-center gap-2 pulse-cta" style={{ background: "#132A28", border: "1px solid #4FD1C5" }}>
            <RefreshCw size={18} color="#4FD1C5" className={bulk ? "animate-spin" : ""} />
            <span style={{ color: "#4FD1C5", fontSize: "13px", fontWeight: "bold" }}>{bulk ? "최신 시세 불러오는 중... " + bulk.done + "/" + bulk.total : "시작 전, 최신 시세로 한 번 갱신하기"}</span>
          </button>
        )}

        {summary.isEmpty && (
          <div className="panel rounded-lg px-4 py-3" style={{ color: "#8B96A5", fontSize: "12px", lineHeight: 1.6 }}>
            아직 입력된 보유 수량이 없어요. 종목 카드를 눌러 <span style={{ color: "#E8ECEF" }}>수량·평단가</span>를 입력하면 모든 집계가 자동으로 시작돼요.
          </div>
        )}

        <ActionPanel summary={summary} onJumpHolding={jumpToHolding} onJumpBil={jumpToBil} />
        <SummaryPanel summary={summary} goals={goals} />
        <AllocationPanel summary={summary} holdings={holdings} phase2={phase2} bilBalance={bilBalance} />

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-bold">1단계 · 보유자산</div>
            <button onClick={() => setShowAddForm((s) => !s)} className="flex items-center gap-1 px-3 py-2 rounded-md hover:bg-gray-800" style={{ background: "#1A2027", color: "#4FD1C5", fontSize: "12px" }}>
              <Plus size={14} /> 추가
            </button>
          </div>

          {showAddForm && <AddHoldingForm onAdd={addHolding} onCancel={() => setShowAddForm(false)} />}

          <div className="space-y-2">
            {holdings.map((h) => (
              <HoldingCard
                key={h.id} h={h} expanded={!!expandedIds[h.id]} onToggle={() => toggleExpand(h.id)} onChange={(field, v) => changeHolding(h.id, field, v)} onDelete={() => removeHoldingById(h.id)} onRefresh={() => refreshAsset(h, "holding")} busy={busyKey === h.id} refreshDisabled={!!bulk} weightPct={summary.weights[h.id]} registerRef={(el) => { cardRefs.current[h.id] = el; }}
              />
            ))}
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-bold">2단계 · SCHD·SCHG (배당·성장 코어)</div>
            <div style={{ color: "#8B96A5", fontSize: "11px" }}>{fmtCurrency(summary.phase2ValueUSD, false)}</div>
          </div>
          <div className="space-y-2">
            {phase2.map((p) => (
              <Phase2Card key={p.id} p={p} onChange={(field, v) => changePhase2(p.id, field, v)} onRefresh={() => refreshAsset(p, "phase2")} busy={busyKey === p.id} refreshDisabled={!!bulk} weightPct={summary.weights[p.id]} />
            ))}
          </div>
        </div>

        <BilCard innerRef={bilCardRef} bilBalance={bilBalance} onChange={setBilBalance} summary={summary} bilMinPct={bilMinPct} />
        <RulesPanel open={showRules} onToggle={() => setShowRules((s) => !s)} />

        <div className="text-center pt-2 pb-4" style={{ color: "#4A535C", fontSize: "11px" }}>
          1단계 목표수량을 채우면 상단 스텝이 자동으로 2단계로 넘어가요.
          {lastSaved && <div className="mono mt-1">마지막 저장 {new Date(lastSaved).toLocaleString("ko-KR")}</div>}
          {saveError && <div style={{ color: "#FF5C5C" }} className="mt-1">저장 중 오류가 발생했습니다. 백업 내보내기를 권장해요.</div>}
        </div>
      </div>

      {showSettings && (
        <SettingsModal onClose={() => setShowSettings(false)} exchangeRate={exchangeRate} onRateChange={setExchangeRate} onFetchFx={fetchFx} fxBusy={fxBusy} bilMinPct={bilMinPct} onBilMinChange={setBilMinPct} goals={goals} onGoalsChange={setGoals} onExport={handleExportData} onImportFile={handleImportData} lastBackupAt={lastBackupAt} backupStale={backupStale} onResetAll={handleResetAll} />
      )}

      <ToastHost toasts={toasts} onClose={removeToast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PortfolioConsole />);
</script>
</body>
</html>
