<script>
function showError(msg) {
  var box = document.getElementById('errbox');
  box.style.display = 'block';
  box.textContent = '오류 발생:\n' + msg + '\n\n이 화면을 캡처해서 확인해보세요.';
  document.getElementById('boot').textContent = '앱 로딩 실패';
}
window.onerror = function(msg, src, line, col, err) {
  showError(msg + '\n위치: ' + (src||'') + ' ' + line + ':' + col);
};
function cdnFail(name) {
  showError(name + ' 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인해주세요.');
}
</script>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" onerror="cdnFail('React')"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" onerror="cdnFail('ReactDOM')"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js" onerror="cdnFail('Babel')"></script>
<script src="https://cdn.tailwindcss.com" onerror="cdnFail('Tailwind')"></script>

<script>
window.addEventListener('load', function() {
  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
    if (document.getElementById('errbox').style.display !== 'block') cdnFail('필수');
    return;
  }
  try {
    var code = document.getElementById('app-src').textContent;
    var compiled = Babel.transform(code, { presets: ['react'] }).code;
    (new Function(compiled))();
    document.getElementById('boot').style.display = 'none';
  } catch (e) {
    showError(e.message + (e.stack ? '\n' + e.stack.split('\n').slice(0,3).join('\n') : ''));
  }
});
</script>

const { useState, useEffect, useRef, useCallback } = React;

const DEFAULT_HOLDINGS = [

];

const DEFAULT_PHASE2 = [
  { id: "p1", ticker: "SCHD", name: "SCHD (배당 코어)", qty: 0, avgPrice: 0, price: 32.92, high52: 33.50, divPerShare: 1.05 },
  { id: "p2", ticker: "SCHG", name: "SCHG (성장 코어)", qty: 0, avgPrice: 0, price: 34.27, high52: 35.42, divPerShare: 0.12 },
];

const DIVIDEND_GOAL_KRW = 80000000;
const FINAL_GOAL_KRW = 2000000000;

function uid() { return "h" + Math.random().toString(36).slice(2, 9); }
function fmtUSD(n) { return !isFinite(n) ? "$0" : "$" + Math.round(n).toLocaleString("en-US"); }
function fmtKRWShort(n) {
  if (!isFinite(n)) return "0원";
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 100000000) {
    const v = abs / 100000000;
    return sign + (Number.isInteger(v * 10) ? v.toFixed(1) : v.toFixed(2)).replace(/\.0$/, "") + "억원";
  }
  if (abs >= 10000) {
    return sign + Math.round(abs / 10000).toLocaleString("ko-KR") + "만원";
  }
  return sign + Math.round(abs).toLocaleString("ko-KR") + "원";
}

function PortfolioConsole() {
  const [holdings, setHoldings] = useState(DEFAULT_HOLDINGS);
  const [phase2, setPhase2] = useState(DEFAULT_PHASE2);
  const [bilBalance, setBilBalance] = useState(0);
  const [exchangeRate, setExchangeRate] = useState(1480);
  const [finnhubKey, setFinnhubKey] = useState(HARDCODED_API_KEY);

  const [loaded, setLoaded] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showRules, setShowRules] = useState(true);
  const [showAddForm, setShowAddForm] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [fetchingId, setFetchingId] = useState(null);
  const [fetchError, setFetchError] = useState(null);
  const [cooldowns, setCooldowns] = useState({});
  const [isUpdatingRate, setIsUpdatingRate] = useState(false);
  const [isRefreshingAll, setIsRefreshingAll] = useState(false);
  const bulkCooldownRef = useRef(0);
  const [bilMinPct, setBilMinPct] = useState(10);
  const [showKey, setShowKey] = useState(false);
  const [expandedIds, setExpandedIds] = useState({});
  const saveTimer = useRef(null);
  const cardRefs = useRef({});
  const bilCardRef = useRef(null);

  const STORAGE_KEY = "portfolio-data-v5";

  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (Array.isArray(data.holdings)) setHoldings(data.holdings);
        if (Array.isArray(data.phase2)) setPhase2(data.phase2);
        if (typeof data.bilBalance === "number") setBilBalance(data.bilBalance);
        if (typeof data.exchangeRate === "number") setExchangeRate(data.exchangeRate);
        if (typeof data.finnhubKey === "string" && data.finnhubKey.trim() !== "") {
          setFinnhubKey(data.finnhubKey);
        } else {
          setFinnhubKey(HARDCODED_API_KEY);
        }
        if (typeof data.bilMinPct === "number") setBilMinPct(data.bilMinPct);
        if (data.lastUpdated) setLastSaved(data.lastUpdated);
      } else {
        setFinnhubKey(HARDCODED_API_KEY);
      }
    } catch (e) {
      console.warn("데이터 파싱 오류");
      setFinnhubKey(HARDCODED_API_KEY);
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const payload = { holdings, phase2, bilBalance, exchangeRate, finnhubKey, bilMinPct, lastUpdated: new Date().toISOString() };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        setSaveError(false);
        setLastSaved(payload.lastUpdated);
      } catch (e) {
        setSaveError(true);
      }
    }, 700);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [holdings, phase2, bilBalance, exchangeRate, finnhubKey, bilMinPct, loaded]);

  function updateHolding(id, field, value) { setHoldings((prev) => prev.map((h) => (h.id === id ? { ...h, [field]: value } : h))); }
  function removeHolding(id) { setHoldings((prev) => prev.filter((h) => h.id !== id)); }
  function addHolding(nh) { setHoldings((prev) => [...prev, { ...nh, id: uid() }]); setShowAddForm(false); }
  function updatePrice(id, newPrice) {
    setHoldings((prev) => prev.map((h) => (h.id !== id ? h : { ...h, price: newPrice, high52: Math.max(newPrice, h.high52) })));
  }
  function updatePhase2(id, field, value) { setPhase2((prev) => prev.map((p) => (p.id === id ? { ...p, [field]: value } : p))); }
  function toggleExpand(id) { setExpandedIds((prev) => ({ ...prev, [id]: !prev[id] })); }
  function jumpToHolding(id) {
    setExpandedIds((prev) => ({ ...prev, [id]: true }));
    setTimeout(() => {
      const el = cardRefs.current[id];
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 50);
  }
  function jumpToBil() {
    if (bilCardRef.current) bilCardRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  const CRYPTO_IDS = { BTC: "bitcoin", ETH: "ethereum" };
  async function fetchCryptoLive(h) {
    const coinId = CRYPTO_IDS[h.ticker];
    if (!coinId) return;
    if (Date.now() - (cooldowns[h.ticker] || 0) < 30000) {
      setFetchError(`${h.ticker} 조회는 잠시 후 다시 시도해줘.`); return;
    }
    setFetchingId(h.id); setFetchError(null);
    try {
      const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
      if (!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      const currentPrice = data[coinId].usd;
      if (!currentPrice) throw new Error("no data");
      setHoldings((prev) => prev.map((x) => (x.id === h.id ? { ...x, price: currentPrice, high52: Math.max(currentPrice, x.high52) } : x)));
      setCooldowns((prev) => ({ ...prev, [h.ticker]: Date.now() }));
    } catch (e) { setFetchError(`${h.ticker} 코인 조회 실패 - 수동 입력 필요`); }
    finally { setFetchingId(null); }
  }

  async function fetchDividendPerShare(ticker) {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${finnhubKey}`);
      if (!res.ok) return null;
      const data = await res.json();
      const m = data && data.metric;
      if (!m) return null;
      const val = (typeof m.dividendPerShareTTM === "number" ? m.dividendPerShareTTM : (typeof m.dividendPerShareAnnual === "number" ? m.dividendPerShareAnnual : null));
      return (typeof val === "number" && val >= 0) ? val : null;
    } catch (e) {
      return null;
    }
  }
  async function fetchStockLive(ticker, applyFn) {
    if (!finnhubKey) { setFetchError("Finnhub API Key가 세팅되지 않았습니다."); return; }
    if (Date.now() - (cooldowns[ticker] || 0) < 10000) {
      setFetchError(`${ticker} 조회 쿨타임(10초)입니다.`); return;
    }
    setFetchingId(ticker); setFetchError(null);
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${finnhubKey}`);
      if (!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      if (data.c === 0 && data.h === 0) throw new Error("invalid ticker");
      const div = await fetchDividendPerShare(ticker);
      applyFn(data.c, data.h, div);
      setCooldowns((prev) => ({ ...prev, [ticker]: Date.now() }));
    } catch (e) { setFetchError(`${ticker} 조회 실패 - 티커를 확인해줘.`); }
    finally { setFetchingId(null); }
  }
  function fetchHoldingLive(h) {
    if (h.isCrypto) return fetchCryptoLive(h);
    return fetchStockLive(h.ticker, (price, todayHigh, div) => {
      setHoldings((prev) => prev.map((x) => (x.id === h.id ? { ...x, price, high52: Math.max(price, todayHigh, x.high52), divPerShare: (div != null ? div : x.divPerShare) } : x)));
    });
  }
  function fetchPhase2Live(p) {
    return fetchStockLive(p.ticker, (price, todayHigh, div) => {
      setPhase2((prev) => prev.map((x) => (x.id === p.id ? { ...x, price, high52: Math.max(price, todayHigh, x.high52), divPerShare: (div != null ? div : x.divPerShare) } : x)));
    });
  }

  async function refreshAllPrices() {
    if (Date.now() - bulkCooldownRef.current < 20000) {
      setFetchError("전체 갱신은 20초 후에 다시 시도해줘.");
      return;
    }
    setIsRefreshingAll(true);
    setFetchError(null);
    const failed = [];

    for (const h of holdings) {
      try {
        if (h.isCrypto) {
          const coinId = CRYPTO_IDS[h.ticker];
          if (!coinId) continue;
          const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const price = data[coinId] && data[coinId].usd;
          if (!price) throw new Error();
          setHoldings((prev) => prev.map((x) => (x.id === h.id ? { ...x, price, high52: Math.max(price, x.high52) } : x)));
        } else if (finnhubKey) {
          const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${h.ticker}&token=${finnhubKey}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          if (data.c === 0 && data.h === 0) throw new Error();
          const div = await fetchDividendPerShare(h.ticker);
          setHoldings((prev) => prev.map((x) => (x.id === h.id ? { ...x, price: data.c, high52: Math.max(data.c, data.h, x.high52), divPerShare: (div != null ? div : x.divPerShare) } : x)));
        } else {
          continue;
        }
      } catch (e) {
        failed.push(h.ticker);
      }
      await new Promise((r) => setTimeout(r, 350));
    }

    if (finnhubKey) {
      for (const p of phase2) {
        try {
          const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${p.ticker}&token=${finnhubKey}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          if (data.c === 0 && data.h === 0) throw new Error();
          const div = await fetchDividendPerShare(p.ticker);
          setPhase2((prev) => prev.map((x) => (x.id === p.id ? { ...x, price: data.c, high52: Math.max(data.c, data.h, x.high52), divPerShare: (div != null ? div : x.divPerShare) } : x)));
        } catch (e) {
          failed.push(p.ticker);
        }
        await new Promise((r) => setTimeout(r, 350));
      }
    }

    bulkCooldownRef.current = Date.now();
    setIsRefreshingAll(false);
    if (!finnhubKey) {
      setFetchError("Finnhub API Key가 없어 주식·ETF는 갱신하지 못했어(코인만 갱신됨).");
    } else if (failed.length > 0) {
      setFetchError(`일부 조회 실패: ${failed.join(", ")}`);
    }
  }

  const fetchLiveExchangeRate = useCallback(async () => {
    setIsUpdatingRate(true);
    try {
      const res = await fetch("https://open.er-api.com/v6/latest/USD");
      const data = await res.json();
      if (data && data.rates && data.rates.KRW) setExchangeRate(Number(data.rates.KRW.toFixed(2)));
    } catch (e) { setFetchError("환율 자동 조회 실패"); }
    finally { setIsUpdatingRate(false); }
  }, []);

  function calcYield(h) { return (!h.avgPrice || h.qty <= 0) ? 0 : ((h.price - h.avgPrice) / h.avgPrice) * 100; }
  function calcProfit(h) { return (!h.avgPrice || h.qty <= 0) ? 0 : (h.price - h.avgPrice) * h.qty; }
  function dropPct(h) { return (!h.high52 || h.high52 <= 0) ? 0 : ((h.price - h.high52) / h.high52) * 100; }

  function statusOf(h) {
    if ((h.targetQty || 0) > 0 && h.qty >= h.targetQty) return "done";
    const d = dropPct(h);
    if (typeof h.t2 === "number" && d <= h.t2) return "t2";
    if (typeof h.t1 === "number" && d <= h.t1) return "t1";
    return "normal";
  }

  const CASH_COLOR = "#3B82F6";
  const STATUS_META = { normal: { label: "정상", color: "#3DDC97" }, t1: { label: "2배 매수", color: "#FFB020" }, t2: { label: "BIL 집행", color: "#FF5C5C" }, done: { label: "목표 달성", color: "#60A5FA" } };

  const phase1TargetUSD = holdings.reduce((sum, h) => sum + (h.targetQty || 0) * h.price, 0);
  const phase1CurrentUSD = holdings.reduce((sum, h) => sum + h.qty * h.price, 0);
  const phase1Progress = phase1TargetUSD > 0 ? Math.min(100, (phase1CurrentUSD / phase1TargetUSD) * 100) : 0;
  const phase1Done = phase1TargetUSD > 0 && phase1CurrentUSD >= phase1TargetUSD;

  const phase2ValueUSD = phase2.reduce((sum, p) => sum + p.qty * p.price, 0);
  const phase2InvestedUSD = phase2.reduce((sum, p) => sum + p.qty * (p.avgPrice || 0), 0);
  const phase2ProfitUSD = phase2ValueUSD - phase2InvestedUSD;

  const annualDividendUSD =
    holdings.reduce((sum, h) => sum + h.qty * (h.divPerShare || 0), 0) +
    phase2.reduce((sum, p) => sum + p.qty * (p.divPerShare || 0), 0);
  const annualDividendKRW = annualDividendUSD * exchangeRate;
  const dividendProgress = Math.min(100, (annualDividendKRW / DIVIDEND_GOAL_KRW) * 100);
  const dividendGoalReached = annualDividendKRW >= DIVIDEND_GOAL_KRW;

  const phase1InvestedUSD = holdings.reduce((sum, h) => sum + h.qty * (h.avgPrice || 0), 0);
  const phase1ProfitUSD = phase1CurrentUSD - phase1InvestedUSD;
  const totalInvestedUSD = phase1InvestedUSD + phase2InvestedUSD;
  const holdingsValueUSD = phase1CurrentUSD;
  const totalValueUSD = holdingsValueUSD + phase2ValueUSD + bilBalance;
  const bilPctOfTotal = totalValueUSD > 0 ? (bilBalance / totalValueUSD) * 100 : 0;
  const bilLow = totalValueUSD > 0 && bilPctOfTotal < bilMinPct;
  const totalValueKRW = totalValueUSD * exchangeRate;
  const totalProfitUSD = phase1ProfitUSD + phase2ProfitUSD;
  const totalYieldPct = totalInvestedUSD > 0 ? (totalProfitUSD / totalInvestedUSD) * 100 : 0;

  const phase1KRW = phase1CurrentUSD * exchangeRate;
  const phase2KRW = phase2ValueUSD * exchangeRate;
  const cashKRW = bilBalance * exchangeRate;
  const combinedKRW = phase1KRW + phase2KRW + cashKRW;
  const finalProgress = Math.min(100, (combinedKRW / FINAL_GOAL_KRW) * 100);
  const seg1 = Math.min(100, (phase1KRW / FINAL_GOAL_KRW) * 100);
  const seg2 = Math.min(100 - seg1, (phase2KRW / FINAL_GOAL_KRW) * 100);
  const seg3 = Math.min(100 - seg1 - seg2, (cashKRW / FINAL_GOAL_KRW) * 100);

  const coreValueUSD = holdings.filter((h) => h.category === "core").reduce((s, h) => s + h.qty * h.price, 0);
  const satelliteValueUSD = holdings.filter((h) => h.category === "satellite").reduce((s, h) => s + h.qty * h.price, 0);
  const totalForBar = coreValueUSD + satelliteValueUSD + phase2ValueUSD + bilBalance || 1;
  const corePct = (coreValueUSD / totalForBar) * 100;
  const satellitePct = (satelliteValueUSD / totalForBar) * 100;
  const phase2Pct = (phase2ValueUSD / totalForBar) * 100;
  const cashPct = (bilBalance / totalForBar) * 100;
  const triggeredCount = holdings.filter((h) => { const s = statusOf(h); return s === "t1" || s === "t2"; }).length;
  const currentPhaseIdx = dividendGoalReached ? 2 : (phase1Done ? 1 : 0);
  const actionItems = holdings
    .map((h) => ({ h, status: statusOf(h), drop: dropPct(h) }))
    .filter((x) => x.status === "t1" || x.status === "t2")
    .sort((a, b) => a.drop - b.drop);

  return (
    <div style={{ fontFamily: "'Noto Sans KR', sans-serif", background: "#0B0E11", minHeight: "100vh", color: "#E8ECEF" }} className="w-full min-h-screen pb-16 relative">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .mono { font-family: 'JetBrains Mono', monospace; }
        .panel { background: #12161B; border: 1px solid #1F262D; }
        .led { box-shadow: 0 0 8px 1px currentColor; }
        input:focus { outline: 1px solid #4FD1C5; }
      `}</style>

      <div className="panel" style={{ borderLeft: "none", borderRight: "none", borderTop: "none" }}>
        <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
          <div>
            <div className="mono tracking-widest" style={{ color: "#4FD1C5", fontSize: "11px" }}>PF-06 (일괄갱신·배당)</div>
            <div className="text-lg font-bold">자산 관제 콘솔</div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={refreshAllPrices} disabled={isRefreshingAll} title="전체 시세 일괄 갱신" className="p-2 rounded-md hover:bg-gray-800 flex items-center gap-1.5" style={{ background: "#1A2027" }}>
              <RefreshCw size={18} color="#4FD1C5" className={isRefreshingAll ? "animate-spin" : ""} />
              <span style={{ color: "#4FD1C5", fontSize: "11px" }} className="hidden sm:inline">{isRefreshingAll ? "갱신중" : "전체갱신"}</span>
            </button>
            <button onClick={() => setShowSettings(true)} className="p-2 rounded-md hover:bg-gray-800" style={{ background: "#1A2027" }}>
              <Settings size={18} color="#8B96A5" />
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 pt-5 space-y-5">
        {fetchError && (
          <div className="rounded-lg px-4 py-2 flex items-center justify-between" style={{ background: "#241417", border: "1px solid #4A2126", color: "#FF8A8A", fontSize: "12px" }}>
            <span>{fetchError}</span>
            <button onClick={() => setFetchError(null)}><X size={14} color="#FF8A8A" /></button>
          </div>
        )}

        <div className="panel rounded-lg overflow-hidden" style={{ border: (actionItems.length > 0 || bilLow) ? "1px solid #4A2126" : "1px solid #1F262D" }}>
          <div className="p-4 pb-2 flex items-center gap-2">
            <AlertTriangle size={16} color={(actionItems.length > 0 || bilLow) ? "#FFB020" : "#3DDC97"} />
            <div className="text-sm font-bold">지금 확인할 항목 {(actionItems.length + (bilLow ? 1 : 0)) > 0 ? `${actionItems.length + (bilLow ? 1 : 0)}건` : ""}</div>
          </div>
          {actionItems.length === 0 && !bilLow ? (
            <div className="px-4 pb-4" style={{ color: "#3DDC97", fontSize: "12px" }}>모든 종목 정상 · 매수 트리거 없음</div>
          ) : (
            <div className="px-4 pb-4 flex flex-wrap gap-2">
              {actionItems.map(({ h, status }) => (
                <button key={h.id} onClick={() => jumpToHolding(h.id)} className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: "#1A2027" }}>
                  <span className="w-2 h-2 rounded-full led" style={{ background: STATUS_META[status].color, color: STATUS_META[status].color }} />
                  <span className="mono font-bold text-sm">{h.ticker}</span>
                </button>
              ))}
              {bilLow && (
                <button onClick={jumpToBil} className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: "#1A2027" }}>
                  <span className="w-2 h-2 rounded-full led" style={{ background: "#FFB020", color: "#FFB020" }} />
                  <span className="mono font-bold text-sm">BIL</span>
                </button>
              )}
            </div>
          )}
        </div>

        <div className="panel rounded-lg p-5">
          <div className="flex items-baseline justify-between flex-wrap gap-2">
            <div>
              <div style={{ color: "#8B96A5", fontSize: "12px" }}>총 평가액 (1단계+2단계+현금)</div>
              <div className="mono text-3xl font-bold">{fmtKRWShort(totalValueKRW)}</div>
              <div className="flex items-center gap-2 mt-1">
                <div className="mono" style={{ color: "#8B96A5", fontSize: "12px" }}>{fmtUSD(totalValueUSD)}</div>
                {totalInvestedUSD > 0 && (
                  <div className="mono" style={{ color: totalProfitUSD >= 0 ? "#3DDC97" : "#FF5C5C", fontSize: "12px" }}>
                    ({totalProfitUSD >= 0 ? "+" : ""}{totalYieldPct.toFixed(1)}%)
                  </div>
                )}
              </div>
            </div>
            <div className="text-right">
              <div style={{ color: "#8B96A5", fontSize: "12px" }}>트리거 발동 자산</div>
              <div className="mono text-2xl font-bold" style={{ color: triggeredCount > 0 ? "#FFB020" : "#3DDC97" }}>{triggeredCount}건</div>
            </div>
          </div>

          <div className="mt-5">
            <div className="flex justify-between mb-1" style={{ color: "#8B96A5", fontSize: "12px" }}>
              <span>1단계 · 개별 종목·ETF 목표수량 달성률{phase1Done ? " · 완료" : ""}</span>
              <span className="mono" style={{ color: phase1Done ? "#3DDC97" : "#8B96A5" }}>{phase1Progress.toFixed(1)}%</span>
            </div>
            <div className="w-full rounded-full h-2" style={{ background: "#1A2027" }}>
              <div className="h-2 rounded-full" style={{ width: `${phase1Progress}%`, background: phase1Done ? "#3DDC97" : "#4FD1C5" }} />
            </div>
          </div>

          <div className="mt-4">
            <div className="flex justify-between mb-1" style={{ color: "#8B96A5", fontSize: "12px" }}>
              <span>2단계 목표 · 20억원 (달성 시 3단계 진입)</span>
              <span className="mono">{finalProgress.toFixed(2)}%</span>
            </div>
            <div className="w-full h-3 rounded-full overflow-hidden flex" style={{ background: "#1A2027" }}>
              <div style={{ width: `${seg1}%`, background: "#4FD1C5" }} />
              <div style={{ width: `${seg2}%`, background: "#B18CFF" }} />
              <div style={{ width: `${seg3}%`, background: CASH_COLOR }} />
            </div>
            <div className="flex gap-3 mt-2 flex-wrap" style={{ color: "#8B96A5", fontSize: "11px" }}>
              <span><span className="inline-block w-2 h-2 rounded-full mr-1" style={{ background: "#4FD1C5" }} />1단계 {fmtKRWShort(phase1KRW)}</span>
              <span><span className="inline-block w-2 h-2 rounded-full mr-1" style={{ background: "#B18CFF" }} />2단계(SCHD·SCHG) {fmtKRWShort(phase2KRW)}</span>
              <span><span className="inline-block w-2 h-2 rounded-full mr-1" style={{ background: CASH_COLOR }} />현금(BIL) {fmtKRWShort(cashKRW)}</span>
            </div>
          </div>

          <div className="mt-4">
            <div className="flex justify-between mb-1" style={{ color: "#8B96A5", fontSize: "12px" }}>
              <span>3단계 최종목표 · 연 배당금(세전) 8,000만원{dividendGoalReached ? " · 달성" : ""}</span>
              <span className="mono" style={{ color: dividendGoalReached ? "#60A5FA" : "#8B96A5" }}>{fmtKRWShort(annualDividendKRW)}</span>
            </div>
            <div className="w-full rounded-full h-2" style={{ background: "#1A2027" }}>
              <div className="h-2 rounded-full" style={{ width: `${dividendProgress}%`, background: dividendGoalReached ? "#60A5FA" : "#B18CFF" }} />
            </div>
            <div className="mt-1" style={{ color: "#5C666F", fontSize: "11px" }}>{dividendProgress.toFixed(1)}% · 세전 기준, 실수령액은 배당소득세 등 공제 후 감소</div>
          </div>

          <div className="flex mt-5 gap-2">
            {["성장자산 매집", "SCHD·SCHG 전환", "배당 전환"].map((label, i) => (
              <div key={label} className="flex-1 text-center">
                <div className="mono mb-1" style={{ color: i === currentPhaseIdx ? "#4FD1C5" : i < currentPhaseIdx ? "#3DDC97" : "#4A535C", fontSize: "11px" }}>{`0${i + 1}`}</div>
                <div className="h-1 rounded-full mb-1" style={{ background: i === currentPhaseIdx ? "#4FD1C5" : i < currentPhaseIdx ? "#3DDC97" : "#1F262D" }} />
                <div style={{ color: i === currentPhaseIdx ? "#E8ECEF" : "#4A535C", fontSize: "11px" }}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="panel rounded-lg p-5">
          <div className="mb-3" style={{ color: "#8B96A5", fontSize: "12px" }}>자산 현황</div>
          <div className="flex items-center gap-5 flex-wrap">
            <div className="relative flex-shrink-0" style={{ width: 148, height: 148 }}>
              <DonutChart
                size={148}
                strokeWidth={20}
                segments={[
                  { value: coreValueUSD * exchangeRate, color: "#4FD1C5" },
                  { value: satelliteValueUSD * exchangeRate, color: "#FFB020" },
                  { value: phase2KRW, color: "#B18CFF" },
                  { value: cashKRW, color: CASH_COLOR },
                ]}
              />
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <div className="mono font-bold" style={{ fontSize: "13px" }}>{fmtKRWShort(totalValueKRW)}</div>
                <div style={{ color: "#5C666F", fontSize: "10px" }}>총 자산</div>
              </div>
            </div>
            <div className="flex-1 min-w-[140px] space-y-1.5" style={{ fontSize: "11px", color: "#8B96A5" }}>
              <div className="flex justify-between"><span><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ background: "#4FD1C5" }} />1단계 핵심</span><span className="mono">{corePct.toFixed(0)}%</span></div>
              <div className="flex justify-between"><span><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ background: "#FFB020" }} />1단계 위성</span><span className="mono">{satellitePct.toFixed(0)}%</span></div>
              <div className="flex justify-between"><span><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ background: "#B18CFF" }} />2단계 SCHD·SCHG</span><span className="mono">{phase2Pct.toFixed(0)}%</span></div>
              <div className="flex justify-between"><span><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ background: CASH_COLOR }} />현금(BIL)</span><span className="mono">{cashPct.toFixed(0)}%</span></div>
            </div>
          </div>

          <div className="mt-5 pt-4 space-y-2" style={{ borderTop: "1px solid #1F262D" }}>
            {[
              ...holdings.map((h) => ({ key: h.id, ticker: h.ticker, value: h.qty * h.price, color: h.category === "core" ? "#4FD1C5" : "#FFB020" })),
              ...phase2.map((p) => ({ key: p.id, ticker: p.ticker, value: p.qty * p.price, color: "#B18CFF" })),
              { key: "bil", ticker: "BIL", value: bilBalance, color: CASH_COLOR },
            ]
              .filter((x) => x.value > 0)
              .sort((a, b) => b.value - a.value)
              .map((x, i, arr) => {
                const maxVal = Math.max(...arr.map((y) => y.value), 1);
                const widthPct = (x.value / maxVal) * 100;
                return (
                  <div key={x.key} className="flex items-center gap-2">
                    <div className="mono flex-shrink-0" style={{ width: 44, color: "#8B96A5", fontSize: "11px" }}>{x.ticker}</div>
                    <div className="flex-1 rounded-full h-2" style={{ background: "#1A2027" }}>
                      <div className="h-2 rounded-full" style={{ width: `${widthPct}%`, background: x.color }} />
                    </div>
                    <div className="mono flex-shrink-0 text-right" style={{ width: 72, fontSize: "11px" }}>{fmtUSD(x.value)}</div>
                  </div>
                );
              })}
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-bold">1단계 · 보유자산</div>
            <button onClick={() => setShowAddForm((s) => !s)} className="flex items-center gap-1 px-2 py-1 rounded-md hover:bg-gray-800" style={{ background: "#1A2027", color: "#4FD1C5", fontSize: "12px" }}>
              <Plus size={14} /> 추가
            </button>
          </div>

          {showAddForm && <AddHoldingForm onAdd={addHolding} onCancel={() => setShowAddForm(false)} finnhubKey={finnhubKey} />}

          <div className="space-y-2">
            {holdings.map((h) => {
              const status = statusOf(h);
              const meta = STATUS_META[status];
              const d = dropPct(h);
              const value = h.qty * h.price;
              const yld = calcYield(h);
              const prf = calcProfit(h);
              const targetQty = h.targetQty || 0;
              const remainingQty = Math.max(0, targetQty - h.qty);
              const remainingAmount = remainingQty * h.price;
              const targetProgress = targetQty > 0 ? Math.min(100, (h.qty / targetQty) * 100) : 0;
              const expanded = !!expandedIds[h.id];

              return (
                <div key={h.id} ref={(el) => { cardRefs.current[h.id] = el; }} className="panel rounded-lg overflow-hidden">
                  <div className="flex items-center justify-between p-4 cursor-pointer" onClick={() => toggleExpand(h.id)}>
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="w-2.5 h-2.5 rounded-full led flex-shrink-0" style={{ background: meta.color, color: meta.color }} />
                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="mono font-bold text-sm">{h.ticker}</span>
                          <span style={{ color: "#8B96A5", fontSize: "12px" }}>{h.name}</span>
                          {h.isCrypto && <span className="px-1.5 py-0.5 rounded" style={{ background: "#1A2027", color: "#8B96A5", fontSize: "10px" }}>코인</span>}
                        </div>
                        <div className="mt-0.5" style={{ color: meta.color, fontSize: "11px" }}>{meta.label} · {d.toFixed(1)}%</div>
                      </div>
                    </div>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      <div className="mono text-sm font-bold mr-1">{fmtUSD(value)}</div>
                      <button onClick={(e) => { e.stopPropagation(); fetchHoldingLive(h); }} disabled={fetchingId === h.id || fetchingId === h.ticker} className="p-1 hover:bg-gray-800 rounded">
                        <RefreshCw size={14} color="#4FD1C5" className={(fetchingId === h.id || fetchingId === h.ticker) ? "animate-spin" : ""} />
                      </button>
                      <button onClick={(e) => { e.stopPropagation(); removeHolding(h.id); }} className="p-1 hover:bg-gray-800 rounded">
                        <Trash2 size={14} color="#4A535C" />
                      </button>
                      {expanded ? <ChevronUp size={16} color="#8B96A5" /> : <ChevronDown size={16} color="#8B96A5" />}
                    </div>
                  </div>

                  {expanded && (
                    <div className="px-4 pb-4" style={{ borderTop: "1px solid #1F262D" }}>
                      <div className="grid grid-cols-3 gap-2 mt-3">
                        <Field label="수량" value={h.qty} onChange={(v) => updateHolding(h.id, "qty", v)} />
                        <Field label="평단가($)" value={h.avgPrice || 0} onChange={(v) => updateHolding(h.id, "avgPrice", v)} />
                        <Field label="현재가($)" value={h.price} onChange={(v) => updatePrice(h.id, v)} />
                      </div>
                      <div className="grid grid-cols-2 gap-2 mt-2">
                        <Field label="52주 고가($)" value={h.high52} onChange={(v) => updateHolding(h.id, "high52", v)} />
                        <Field label="목표수량(주/개)" value={h.targetQty || 0} onChange={(v) => updateHolding(h.id, "targetQty", v)} />
                      </div>

                      <div className="grid grid-cols-3 gap-2 mt-2 pt-2" style={{ borderTop: "1px dashed #1F262D" }}>
                        <Field label="1차 트리거(%)" value={h.t1 || 0} onChange={(v) => updateHolding(h.id, "t1", v)} />
                        <Field label="2차 트리거(%)" value={h.t2 || 0} onChange={(v) => updateHolding(h.id, "t2", v)} />
                        <Field label="과거 MDD(%)" value={h.mdd || 0} onChange={(v) => updateHolding(h.id, "mdd", v)} />
                      </div>

                      <div className="grid grid-cols-2 gap-2 mt-2">
                        <Field label="연배당($/주)" value={h.divPerShare || 0} onChange={(v) => updateHolding(h.id, "divPerShare", v)} />
                        <div>
                          <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>예상 연배당</div>
                          <div className="mono text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#60A5FA" }}>{fmtUSD(h.qty * (h.divPerShare || 0))}</div>
                        </div>
                      </div>

                      <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: "1px solid #1F262D" }}>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="mono" style={{ color: d <= 0 ? "#FF5C5C" : "#3DDC97", fontSize: "12px", fontWeight: "bold" }}>현재하락 {d.toFixed(1)}%</span>
                            <span className="mono" style={{ color: "#5C666F", fontSize: "10px" }}>(최악기준 {h.mdd || 0}%)</span>
                          </div>
                          {h.qty > 0 && h.avgPrice > 0 && (
                            <div className="mono mt-0.5" style={{ color: yld >= 0 ? "#3DDC97" : "#FF5C5C", fontSize: "12px" }}>
                              수익 {yld >= 0 ? "+" : ""}{yld.toFixed(1)}% ({fmtUSD(prf)})
                            </div>

                        </div>
                      </div>

                      {targetQty > 0 && (
                        <div className="mt-3 pt-3" style={{ borderTop: "1px solid #1F262D" }}>
                          <div className="flex justify-between mb-1" style={{ color: "#8B96A5", fontSize: "11px" }}>
                            <span>수량 달성률 (목표 {targetQty}주)</span>
                            <span className="mono">{targetProgress.toFixed(0)}%</span>
                          </div>
                          <div className="w-full rounded-full h-1.5 mb-1.5" style={{ background: "#1A2027" }}>
                            <div className="h-1.5 rounded-full" style={{ width: `${targetProgress}%`, background: remainingQty <= 0 ? "#3DDC97" : "#4FD1C5" }} />
                          </div>
                          <div className="mono" style={{ color: remainingQty <= 0 ? "#3DDC97" : "#B8C1CA", fontSize: "12px" }}>
                            {remainingQty <= 0 ? "✅ 수량 목표 달성!" : `목표까지 ${remainingQty}주 남음 (약 ${fmtUSD(remainingAmount)} 필요)`}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-bold">2단계 · SCHD·SCHG (배당·성장 코어)</div>
            <div style={{ color: "#8B96A5", fontSize: "11px" }}>{fmtUSD(phase2ValueUSD)}</div>
          </div>
          <div className="space-y-2">
            {phase2.map((p) => {
              const value = p.qty * p.price;
              const d = dropPct(p);
              const yld = (!p.avgPrice || p.qty <= 0) ? 0 : ((p.price - p.avgPrice) / p.avgPrice) * 100;
              const prf = (!p.avgPrice || p.qty <= 0) ? 0 : (p.price - p.avgPrice) * p.qty;
              return (
                <div key={p.id} className="panel rounded-lg p-4">
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="mono font-bold text-sm">{p.ticker}</span>
                        <span style={{ color: "#8B96A5", fontSize: "12px" }}>{p.name}</span>
                      </div>
                      <div style={{ color: "#8B96A5", fontSize: "11px" }} className="mt-0.5">고점대비 {d.toFixed(1)}%</div>
                    </div>
                    <button onClick={() => fetchPhase2Live(p)} disabled={fetchingId === p.ticker} className="p-1 hover:bg-gray-800 rounded">
                      <RefreshCw size={14} color="#4FD1C5" className={fetchingId === p.ticker ? "animate-spin" : ""} />
                    </button>
                  </div>
                  <div className="grid grid-cols-3 gap-2 mt-3">
                    <Field label="수량" value={p.qty} onChange={(v) => updatePhase2(p.id, "qty", v)} />
                    <Field label="평단가($)" value={p.avgPrice || 0} onChange={(v) => updatePhase2(p.id, "avgPrice", v)} />
                    <Field label="현재가($)" value={p.price} onChange={(v) => updatePhase2(p.id, "price", v)} />
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-2">
                    <Field label="연배당($/주)" value={p.divPerShare || 0} onChange={(v) => updatePhase2(p.id, "divPerShare", v)} />
                    <div>
                      <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>예상 연배당</div>
                      <div className="mono text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#60A5FA" }}>{fmtUSD(p.qty * (p.divPerShare || 0))}</div>
                    </div>
                  </div>
                  <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: "1px solid #1F262D" }}>
                    <div>
                      {p.qty > 0 && p.avgPrice > 0 && (
                        <div className="mono" style={{ color: yld >= 0 ? "#3DDC97" : "#FF5C5C", fontSize: "12px" }}>
                          수익 {yld >= 0 ? "+" : ""}{yld.toFixed(1)}% ({fmtUSD(prf)})
                        </div>
                      )}
                    </div>
                    <div className="mono text-sm font-bold">{fmtUSD(value)}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div ref={bilCardRef} className="panel rounded-lg p-4" style={{ border: bilLow ? "1px solid #4A3B1F" : "1px solid #1F262D" }}>
          <div className="flex items-center justify-between">
            <div>
              <div className="text-sm font-bold">대기자금 (BIL)</div>
              <div style={{ color: bilLow ? "#FFB020" : "#8B96A5", fontSize: "11px" }}>
                {bilLow ? `⚠ 전체자산 대비 ${bilPctOfTotal.toFixed(1)}% (최소 ${bilMinPct}% 권장)` : `전체자산 대비 ${bilPctOfTotal.toFixed(1)}% · 트리거 집행 실탄`}
              </div>
            </div>
            <div className="w-32">
              <Field label="잔고($)" value={bilBalance} onChange={setBilBalance} />
            </div>
          </div>
        </div>

        <div className="panel rounded-lg overflow-hidden">
          <button onClick={() => setShowRules((s) => !s)} className="w-full flex items-center justify-between p-4">
            <div className="text-sm font-bold">매수 트리거 규칙 (개별 적용)</div>
            {showRules ? <ChevronUp size={16} color="#8B96A5" /> : <ChevronDown size={16} color="#8B96A5" />}
          </button>
          {showRules && (
            <div className="px-4 pb-4 space-y-3" style={{ color: "#B8C1CA", fontSize: "12px" }}>
              <RuleRow color="#3DDC97" title="정상" desc="정기 분할매수 유지" />
              <RuleRow color="#FFB020" title="1단계 (종목별 1차 트리거 도달)" desc="분할매수 금액 2배로 확대" />
              <RuleRow color="#FF5C5C" title="2단계 (종목별 2차 트리거 도달)" desc="BIL 매도 → 추가 매수 집행" />
              <div className="flex items-start gap-2 pt-2" style={{ borderTop: "1px solid #1F262D" }}>
                <AlertTriangle size={14} color="#8B96A5" style={{ marginTop: 2, flexShrink: 0 }} />
                <span>집행 전 확인: 섹터 전체 동반 하락인지, 개별 기업 고유 리스크인지 먼저 구분할 것</span>
              </div>
            </div>
          )}
        </div>

        <div className="text-center pt-2 pb-4" style={{ color: "#4A535C", fontSize: "11px" }}>
          1단계 목표수량을 채우면 상단 스텝이 자동으로 2단계로 넘어가요.
          {lastSaved && <div className="mono mt-1">마지막 저장 {new Date(lastSaved).toLocaleString("ko-KR")}</div>}
          {saveError && <div style={{ color: "#FF5C5C" }} className="mt-1">저장 중 오류가 발생했습니다.</div>}
        </div>
      </div>

      {showSettings && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="panel rounded-lg p-5 space-y-4 w-full max-w-md max-h-[90vh] overflow-y-auto" style={{ background: "#12161B", border: "1px solid #1F262D" }}>
            <div className="flex items-center justify-between pb-2" style={{ borderBottom: "1px solid #1F262D" }}>
              <div className="text-base font-bold text-white flex items-center gap-2"><Settings size={18} color="#4FD1C5" /> 환경 설정</div>
              <button onClick={() => setShowSettings(false)} className="p-1 hover:bg-gray-800 rounded"><X size={18} color="#8B96A5" /></button>
            </div>
            <div className="pt-2 pb-2" style={{ borderBottom: "1px solid #1F262D" }}>
              <div className="mb-1" style={{ color: "#E8ECEF", fontSize: "13px", fontWeight: "bold" }}>주식 가격 연동 API (Finnhub)</div>
              <div style={{ color: "#8B96A5", fontSize: "11px", marginBottom: "8px" }}>기본 API Key가 설정되어 있습니다. 필요시 변경 가능합니다.</div>
              <div className="relative">
                <input type={showKey ? "text" : "password"} placeholder="API Key 입력" value={finnhubKey} onChange={(e) => setFinnhubKey(e.target.value)}
                  className="mono w-full text-sm rounded px-2 py-2 pr-9" style={{ background: "#0B0E11", border: "1px solid #4FD1C5", color: "#E8ECEF" }} />
                <button type="button" onClick={() => setShowKey((s) => !s)} className="absolute" style={{ right: 8, top: 8 }}>
                  {showKey ? <EyeOff size={16} color="#8B96A5" /> : <Eye size={16} color="#8B96A5" />}
                </button>
              </div>
            </div>
            <div className="flex items-end gap-2">
              <div className="flex-1"><Field label="환율 (₩/$)" value={exchangeRate} onChange={setExchangeRate} /></div>
              <button onClick={fetchLiveExchangeRate} disabled={isUpdatingRate} className="px-3 py-1.5 rounded hover:bg-gray-800" style={{ background: "#1A2027", color: "#4FD1C5", fontSize: "12px", border: "1px solid #1F262D", height: "34px" }}>
                {isUpdatingRate ? "조회중" : "자동 갱신"}
              </button>
            </div>
            <Field label="BIL 최소 비중(%, 전체자산 대비)" value={bilMinPct} onChange={setBilMinPct} />
            <div className="pt-2">
              <button onClick={() => setShowSettings(false)} className="w-full py-2.5 rounded-md font-bold text-center hover:bg-teal-400" style={{ background: "#4FD1C5", color: "#0B0E11", fontSize: "13px" }}>설정 완료 닫기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DonutChart({ segments, size = 148, strokeWidth = 20 }) {
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#1A2027" strokeWidth={strokeWidth} />
      {segments.map((seg, i) => {
        const pct = seg.value / total;
        if (pct <= 0) return null;
        const dash = pct * circumference;
        const gap = circumference - dash;
        const rotation = (acc / total) * 360 - 90;
        acc += seg.value;
        return (
          <circle key={i} cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={seg.color} strokeWidth={strokeWidth}
            strokeDasharray={`${dash} ${gap}`} strokeLinecap="butt" transform={`rotate(${rotation} ${size / 2} ${size / 2})`} />
        );
      })}
    </svg>
  );
}

function Field({ label, value, onChange }) {
  return (
    <div>
      <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>{label}</div>
      <input type="number" value={value} onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
        className="mono w-full text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#E8ECEF" }} />
    </div>
  );
}

function RuleRow({ color, title, desc }) {
  return (
    <div className="flex items-center gap-3">
      <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: color }} />
      <div>
        <div className="mono font-bold" style={{ color: "#E8ECEF" }}>{title}</div>
        <div style={{ color: "#8B96A5" }}>{desc}</div>
      </div>
    </div>
  );
}

function AddHoldingForm({ onAdd, onCancel, finnhubKey }) {
  const [ticker, setTicker] = useState("");
  const [name, setName] = useState("");
  const [category, setCategory] = useState("core");
  const [isCrypto, setIsCrypto] = useState(false);
  const [qty, setQty] = useState(0);
  const [avgPrice, setAvgPrice] = useState(0);
  const [price, setPrice] = useState(0);
  const [high52, setHigh52] = useState(0);
  const [targetQty, setTargetQty] = useState(0);
  const [t1, setT1] = useState(-15);
  const [t2, setT2] = useState(-30);
  const [mdd, setMdd] = useState(0);
  const [divPerShare, setDivPerShare] = useState(0);

  const [suggestions, setSuggestions] = useState([]);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [searching, setSearching] = useState(false);
  const [autoFilling, setAutoFilling] = useState(false);
  const [autoFilled, setAutoFilled] = useState(false);
  const searchTimer = useRef(null);

  useEffect(() => {
    if (!finnhubKey || ticker.trim().length < 1) { setSuggestions([]); setShowSuggestions(false); return; }
    if (searchTimer.current) clearTimeout(searchTimer.current);
    searchTimer.current = setTimeout(async () => {
      setSearching(true);
      try {
        const res = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(ticker)}&token=${finnhubKey}`);
        if (res.ok) {
          const data = await res.json();
          const list = (data.result || []).slice(0, 6);
          setSuggestions(list);
          setShowSuggestions(list.length > 0);
        }
      } catch (e) {
      } finally {
        setSearching(false);
      }
    }, 350);
    return () => { if (searchTimer.current) clearTimeout(searchTimer.current); };
  }, [ticker, finnhubKey]);

  async function selectSuggestion(item) {
    setTicker(item.symbol);
    setName(item.description || item.symbol);
    setShowSuggestions(false);
    setSuggestions([]);
    setAutoFilled(false);
    if (!finnhubKey) return;
    setAutoFilling(true);
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${item.symbol}&token=${finnhubKey}`);
      let newHigh = 0;
      if (res.ok) {
        const data = await res.json();
        if (!(data.c === 0 && data.h === 0)) {
          setPrice(data.c);
          newHigh = Math.max(data.c, data.h || 0);
          setHigh52(newHigh);
        }
      }
      const metricRes = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${item.symbol}&metric=all&token=${finnhubKey}`);
      if (metricRes.ok) {
        const metricData = await metricRes.json();
        const m = metricData && metricData.metric;
        if (m) {
          const div = (typeof m.dividendPerShareTTM === "number") ? m.dividendPerShareTTM : (typeof m.dividendPerShareAnnual === "number" ? m.dividendPerShareAnnual : null);
          if (div != null) setDivPerShare(div);
          if (typeof m["52WeekHigh"] === "number") setHigh52((prev) => Math.max(prev, m["52WeekHigh"]));
        }
      }
      setAutoFilled(true);
    } catch (e) {
    } finally {
      setAutoFilling(false);
    }
  }

  return (
    <div className="panel rounded-lg p-4 mb-2 space-y-3">
      <div className="grid grid-cols-2 gap-2">
        <div className="relative">
          <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>티커 {finnhubKey && <span style={{ color: "#4A535C" }}>· 몇 글자만 입력하면 검색돼요</span>}</div>
          <input
            value={ticker}
            onChange={(e) => { setTicker(e.target.value.toUpperCase()); setAutoFilled(false); }}
            onFocus={() => setShowSuggestions(suggestions.length > 0)}
            onBlur={() => setTimeout(() => setShowSuggestions(false), 150)}
            className="mono w-full text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#E8ECEF" }} />
          {searching && <div style={{ position: "absolute", right: 8, top: 30, fontSize: "10px", color: "#5C666F" }}>검색중</div>}
          {showSuggestions && (
            <div className="absolute z-10 w-full mt-1 rounded-md" style={{ background: "#0B0E11", border: "1px solid #1F262D", maxHeight: "180px", overflowY: "auto" }}>
              {suggestions.map((s) => (
                <button key={s.symbol} type="button" onClick={() => selectSuggestion(s)} className="w-full text-left px-2 py-1.5 hover:bg-gray-800" style={{ fontSize: "11px", color: "#E8ECEF", borderBottom: "1px solid #1F262D" }}>
                  <span className="mono font-bold">{s.symbol}</span> <span style={{ color: "#8B96A5" }}>{s.description}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <div className="mb-1" style={{ color: "#5C666F", fontSize: "10px" }}>이름</div>
          <input value={name} onChange={(e) => setName(e.target.value)} className="w-full text-sm rounded px-2 py-1.5" style={{ background: "#0B0E11", border: "1px solid #1F262D", color: "#E8ECEF" }} />
        </div>
      </div>
      {autoFilling && <div style={{ color: "#4FD1C5", fontSize: "11px" }}>시세·배당 자동으로 채우는 중...</div>}
      {autoFilled && !autoFilling && <div style={{ color: "#3DDC97", fontSize: "11px" }}>현재가·52주고가·배당을 자동으로 채웠어요 · 필요하면 직접 수정하세요</div>}
      <div className="grid grid-cols-3 gap-2">
        <Field label="수량" value={qty} onChange={setQty} />
        <Field label="평단가($)" value={avgPrice} onChange={setAvgPrice} />
        <Field label="현재가($)" value={price} onChange={setPrice} />
      </div>
      <div className="grid grid-cols-2 gap-2">
        <Field label="52주 고가($)" value={high52} onChange={setHigh52} />
        <Field label="목표수량(주/개)" value={targetQty} onChange={setTargetQty} />
      </div>
      <div className="grid grid-cols-3 gap-2 pt-2" style={{ borderTop: "1px dashed #1F262D" }}>
        <Field label="1차 트리거(%)" value={t1} onChange={setT1} />
        <Field label="2차 트리거(%)" value={t2} onChange={setT2} />
        <Field label="과거 MDD(%)" value={mdd} onChange={setMdd} />
      </div>
      <Field label="연배당($/주)" value={divPerShare} onChange={setDivPerShare} />
      <div className="flex items-center gap-4">
        <label className="flex items-center gap-1.5" style={{ color: "#B8C1CA", fontSize: "12px" }}>
          <input type="checkbox" checked={category === "satellite"} onChange={(e) => setCategory(e.target.checked ? "satellite" : "core")} /> 위성자산
        </label>
        <label className="flex items-center gap-1.5" style={{ color: "#B8C1CA", fontSize: "12px" }}>
          <input type="checkbox" checked={isCrypto} onChange={(e) => setIsCrypto(e.target.checked)} /> 코인
        </label>
      </div>
      <div className="flex gap-2 pt-1">
        <button onClick={() => { if (ticker) onAdd({ ticker, name: name || ticker, category, isCrypto, qty, avgPrice, price, high52, targetQty, t1, t2, mdd, divPerShare }); }}
          className="flex-1 py-2 rounded-md font-bold hover:bg-teal-400" style={{ background: "#4FD1C5", color: "#0B0E11", fontSize: "12px" }}>추가</button>
        <button onClick={onCancel} className="flex-1 py-2 rounded-md hover:bg-gray-800" style={{ background: "#1A2027", color: "#8B96A5", fontSize: "12px" }}>취소</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PortfolioConsole />);
</script>
</body>
</html>
